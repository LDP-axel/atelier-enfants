<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/atelier-180.png">
<link rel="icon" type="image/png" href="icons/atelier-180.png">
<link rel="manifest" href="manifest-atelier.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atelier">
<title>L'Atelier des enfants</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="portal.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="portal.js"></script>
</head>
<body>
<main id="main"><p class="sub">Chargement…</p></main>
<script>
const main=$('#main');
function loginView(msg='',cls=''){
  main.innerHTML=`<h1>L'Atelier des enfants</h1><p class="sub">Espace famille. Connexion réservée aux parents.</p>
  <div class="card"><h2>Se connecter</h2>
   <form id="f"><label>Adresse e-mail<input id="em" type="email" autocomplete="email" required></label>
   <label>Mot de passe<input id="pw" type="password" autocomplete="current-password" minlength="8" required></label>
   <div class="row" style="margin-top:14px"><button class="btn" type="submit">Se connecter</button><button class="btn ghost" type="button" id="su">Créer mon compte parent</button></div>
   <p><button class="btn ghost" type="button" id="fg" style="min-height:0;padding:6px 12px;font-size:.9rem">Mot de passe oublié</button></p>
   <div id="m" class="msg ${cls}">${msg}</div></form></div>
  <p class="sub">Sans connexion, chaque atelier marche quand même sur l'appareil, sans sauvegarde en ligne.</p>`;
  const em=()=>$('#em').value.trim(), pw=()=>$('#pw').value;
  $('#f').onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.signInWithPassword({email:em(),password:pw()});
    if(error){$('#m').className='msg err';$('#m').textContent=error.message.includes('confirm')?'Confirmez d’abord votre adresse avec le lien reçu par e-mail.':'E-mail ou mot de passe incorrect.'}else route()};
  $('#su').onclick=async()=>{if(!em()||pw().length<8){$('#m').className='msg err';$('#m').textContent='Entrez votre e-mail et un mot de passe d’au moins 8 caractères, puis recliquez.';return}
    const {error}=await SB.auth.signUp({email:em(),password:pw(),options:{emailRedirectTo:location.href.split('#')[0]}});
    $('#m').className='msg '+(error?'err':'ok');$('#m').textContent=error?error.message:'Compte créé. Ouvrez le lien reçu par e-mail pour le confirmer, puis connectez-vous.'};
  $('#fg').onclick=async()=>{if(!em()){$('#m').className='msg err';$('#m').textContent='Entrez d’abord votre e-mail.';return}
    await SB.auth.resetPasswordForEmail(em(),{redirectTo:location.href.split('#')[0]});$('#m').className='msg ok';$('#m').textContent='Un e-mail pour changer de mot de passe vient d’être envoyé.'};
}
function newPasswordView(){
  main.innerHTML=`<h1>Nouveau mot de passe</h1><div class="card"><form id="f"><label>Nouveau mot de passe<input id="pw" type="password" minlength="8" required></label>
   <div class="row" style="margin-top:14px"><button class="btn" type="submit">Enregistrer</button></div><div id="m" class="msg"></div></form></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.updateUser({password:$('#pw').value});
    if(error){$('#m').className='msg err';$('#m').textContent=error.message}else route()};
}
async function route(){
  if(!SB)return needConfig(main);
  const user=await currentUser();if(!user)return loginView();
  const fam=await myFamily();
  if(!fam){
    main.innerHTML=`<h1>Bienvenue !</h1><div class="card"><h2>Créer votre espace famille</h2><p>Cochez les ateliers de vos enfants. Ensuite, vous pourrez inviter l'autre parent depuis l'espace parents.</p>
     <div class="kidpick">${Object.entries(ATELIERS).map(([slug,a])=>`<label class="ck"><input type="checkbox" value="${slug}"> ${esc(a.first_name)} (${esc(a.grade)})</label>`).join('')}</div>
     <p class="sub">Si l'autre parent vous a déjà invité, déconnectez-vous et reconnectez-vous : l'invitation sera acceptée automatiquement.</p>
     <div class="row"><button class="btn" id="mk">Créer la famille</button><button class="btn ghost" id="out">Se déconnecter</button></div><div id="m" class="msg"></div></div>`;
    $('#mk').onclick=async()=>{const slugs=[...document.querySelectorAll('.kidpick input:checked')].map(i=>i.value);
      if(!slugs.length){$('#m').className='msg err';$('#m').textContent='Cochez au moins un enfant.';return}
      const kids=slugs.map(s=>({slug:s,first_name:ATELIERS[s].first_name,grade:ATELIERS[s].grade}));
      const {error}=await SB.rpc('setup_family',{p_name:'Famille',p_kids:kids});if(error){$('#m').className='msg err';$('#m').textContent=error.message}else route()};
    $('#out').onclick=async()=>{await SB.auth.signOut();route()};
    return;
  }
  const kids=await myChildren();
  // Compteurs : état de chaque atelier, nombre de réponses, parents et invitations
  const ids=kids.map(k=>k.id);
  const [st,par,inv]=await Promise.all([
    SB.from('child_state').select('child_id,state,updated_at').in('child_id',ids),
    SB.rpc('family_parents'),
    SB.from('family_invites').select('family_id,email')]);
  const counts=await Promise.all(kids.map(k=>SB.from('attempts').select('id',{count:'exact',head:true}).eq('child_id',k.id)));
  const ST={};(st.data||[]).forEach(r=>ST[r.child_id]=r);
  const dkey=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
  const ago=t=>{if(!t)return 'jamais';const m=Math.round((Date.now()-new Date(t))/60000);if(m<2)return 'à l’instant';if(m<60)return `il y a ${m} min`;const h=Math.round(m/60);if(h<24)return `il y a ${h} h`;const d=Math.round(h/24);return d===1?'hier':`il y a ${d} jours`};
  const fmtMin=ms=>{const m=Math.round(ms/60000);return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`};
  const statsOf=(k,i)=>{
    const r=ST[k.id], P=r&&r.state||{}, days=P.days||{}, today=dkey(new Date());
    let w={ms:0,q:0,ok:0},all={ms:0,q:0,ok:0};
    for(const [d,x] of Object.entries(days)){all.ms+=x.ms||0;all.q+=x.q||0;all.ok+=x.ok||0;if((Date.now()-new Date(d))/864e5<7){w.ms+=x.ms||0;w.q+=x.q||0;w.ok+=x.ok||0}}
    const t=days[today]||{ms:0,q:0,ok:0}, last=r&&r.updated_at, actif=last&&(Date.now()-new Date(last))<2*864e5;
    return `<div class="kstat"><span class="pill ${actif?'ok':'idle'}">${actif?'Actif':'Inactif'}</span> <span class="sub">dernière activité ${ago(last)}</span></div>
     <div class="kgrid">
      <div><b>${P.stars||0}</b>étoiles</div>
      <div><b>${fmtMin(t.ms||0)}</b>aujourd’hui</div>
      <div><b>${fmtMin(w.ms)}</b>sur 7 jours</div>
      <div><b>${counts[i].count??all.q}</b>exercices faits</div>
      <div><b>${w.q?Math.round(100*w.ok/w.q)+' %':'—'}</b>réussite 7 j</div>
      <div><b>${all.q?Math.round(100*all.ok/all.q)+' %':'—'}</b>réussite totale</div>
     </div>`;
  };
  const fams=[...new Set(kids.map(k=>k.family_id))];
  const famBlock=f=>{
    const fk=kids.filter(k=>k.family_id===f), ps=(par.data||[]).filter(p=>p.family_id===f), iv=(inv.data||[]).filter(x=>x.family_id===f);
    return `<section class="famblock"><h2 class="famtitle">Famille de ${fk.map(k=>esc(k.first_name)).join(' et ')}</h2>
     <div class="kids">${fk.map(k=>{const i=kids.indexOf(k);return `<div class="kid ${esc(k.slug)}"><h2>${esc(k.first_name)}</h2><div class="sub">${esc(k.grade)}</div>
       ${statsOf(k,i)}
       ${ATELIERS[k.slug]?`<a class="btn ${ATELIERS[k.slug].cls}" href="${ATELIERS[k.slug].page}">${ATELIERS[k.slug].btn}</a>`:''}
       <a class="btn mo" href="histoires.html?enfant=${encodeURIComponent(k.slug)}">Atelier d'histoires</a></div>`}).join('')}</div>
     <div class="card famparents"><b>Parents :</b> ${ps.map(p=>`${esc(p.email)}${p.email===user.email?' (vous)':''}${p.role==='owner'?' · créateur':''} <span class="sub">· connexion ${ago(p.last_sign_in)}</span>`).join('<br>')||'—'}
      ${iv.length?`<br><b>Invitation en attente :</b> ${iv.map(x=>esc(x.email)).join(', ')}`:''}</div></section>`;
  };
  main.innerHTML=`<h1>Qui joue aujourd'hui ?</h1><p class="sub">Connecté : ${esc(user.email)}. Tout ce que font les enfants est sauvegardé en ligne.</p>
   ${fams.map(famBlock).join('')}
   <div class="card"><div class="row"><a class="btn ghost" href="parents.html">Espace parents</a><button class="btn ghost" id="out">Se déconnecter</button></div></div>`;
  $('#out').onclick=async()=>{await SB.auth.signOut();route()};
}
if(SB){SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')newPasswordView()})}
route();
</script>
</body>
</html>
