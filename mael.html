function questSVG(hl){
  const open=regionsOpen(), openSet=new Set(REG_ORDER.slice(0,open)), cur=REG_ORDER[open-1];
  let s=`<svg viewBox="0 0 600 420" class="quest" role="img" aria-label="carte de la quête"><defs><clipPath id="isl"><path d="${ISLE.island}"/></clipPath>
   <pattern id="fogp" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="var(--fog)"/><circle cx="10" cy="12" r="9" fill="var(--fog2)"/><circle cx="30" cy="30" r="11" fill="var(--fog2)"/></pattern></defs>
   <rect width="600" height="420" fill="var(--sea)"/>`;
  for(let k=0;k<6;k++)s+=`<path d="M${30+k*95} ${25+(k%3)*130} q8 -6 16 0 t16 0" stroke="var(--river)" stroke-width="2" fill="none" opacity=".5"/>`;
  s+=`<path d="${ISLE.island}" fill="var(--fog)" stroke="var(--mapline)" stroke-width="10" stroke-linejoin="round" opacity=".35"/><g clip-path="url(#isl)">`;
  REG.forEach((r,i)=>{const o=openSet.has(i);s+=`<path d="${ISLE.cells[i]}" fill="${o?r.c:'url(#fogp)'}" stroke="var(--mapline)" stroke-width="1.5" data-act="qreg" data-i="${i}" class="hit ${hl===i?'qnew':''}"/>`});
  s+=`</g><path d="${ISLE.island}" fill="none" stroke="var(--mapline)" stroke-width="3"/>`;
  REG.forEach((r,i)=>{const [x,y]=ISLE.seeds[i];if(openSet.has(i))s+=`<g pointer-events="none">${landmark(r.g,x,y)}<text x="${x}" y="${y+32}" text-anchor="middle" class="qlab">${r.n}</text></g>`;
    else s+=`<text x="${x}" y="${y+8}" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="26" font-weight="700" fill="var(--fogtext)" pointer-events="none">?</text>`});
  const [hx,hy]=ISLE.seeds[cur];s+=`<g pointer-events="none" class="flag"><line x1="${hx+20}" y1="${hy-6}" x2="${hx+20}" y2="${hy-34}" stroke="#3B2F2F" stroke-width="2.5"/><polygon points="${hx+20},${hy-34} ${hx+38},${hy-28} ${hx+20},${hy-22}" fill="var(--fr)"/></g>`;
  return s+'</svg>';
}

function startRevision(){
  const items=shuffle(P.carnet).slice(0,N);if(!items.length)return home();
  setAccent('fr');
  G={mod:REV,qs:items.map(e=>JSON.parse(JSON.stringify(e.q))),i:0,res:[],log:[],memo:false,earned:0,active:true,startStars:P.stars,n:items.length};
  lastAct=Date.now();save();renderQ();
}
function start(id){
  const m=modById(id);setAccent(m.sub);
  const qs=[],keys=new Set();let guard=0;
  while(qs.length<N&&guard++<400){const q=m.gen();if(keys.has(q.key))continue;keys.add(q.key);q.modId=m.id;qs.push(q)}
  G={mod:m,qs,i:0,res:[],log:[],memo:false,earned:0,active:true,startStars:P.stars};
  lastAct=Date.now();save();renderQ();
}

}
function renderQ(){
  const q=G.qs[G.i]; G.locked=false; G.input=''; keyHandler=null;
  let body='';
  const head=`<div class="kicker">${q.kicker}${G.chrono?` · ${G.score} bonne${G.score>1?'s':''} réponse${G.score>1?'s':''}`:` · question ${G.i+1} sur ${G.n||N}`}</div>`;
  if(q.modId)setAccent(modById(q.modId).sub);
  if(q.type==='choice'){
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div>${q.visual?`<div class="svgwrap center">${q.visual}</div>`:''}${q.map?`<div class="mapwrap" id="qmap">${mapSVG(q.map)}</div>`:''}</div><div class="opts ${q.options.length===4&&q.options.every(o=>o.length<12)?'four':''} ${q.letters?'letters':''}">${q.options.map((o,k)=>`<button class="opt" data-act="choose" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  } else if(q.type==='chunks'){
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div><div class="chunks">${q.chunks.map((c,k)=>`<button class="chunk" data-act="chunk" data-k="${k}">${esc(c)}</button>`).join('')}</div></div>`;
  } else if(q.type==='chunksq'){
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div><div class="chunks">${q.chunks.map((c,k)=>`<span class="chunk ${k===q.hlIdx?'hl2':''}">${esc(c)}</span>`).join('')}</div></div><div class="opts four">${q.options.map((o,k)=>`<button class="opt" data-act="choose" data-k="${k}">${o}</button>`).join('')}</div>`;
  } else if(q.type==='num'){

function drawOrder(res){
  const q=G.qs[G.i];
  document.getElementById('ordc').innerHTML=q.events.map((e,k)=>{const pos=G.ord.indexOf(k);
    let cls=pos>=0?'sel':'';if(res)cls+=' '+(res[k]?'ok':'ko');
    return `<button class="ord ${cls}" data-act="ord" data-k="${k}" ${res?'disabled':''}><span class="n">${pos>=0?pos+1:''}</span><span>${esc(e[1])}${res&&e[2]!==null?` <span class="sub">(${e[0]})</span>`:''}</span></button>`}).join('');
}
function ordTap(k){
  if(G.locked||G.ord.includes(k))return;G.ord.push(k);beep([[500+G.ord.length*80,.06]]);
  const q=G.qs[G.i];
  if(G.ord.length<q.events.length){drawOrder();return}
  const sorted=q.events.map((e,k)=>k).sort((a,b)=>q.events[a][0]-q.events[b][0]);
  const res={};G.ord.forEach((k,p)=>{res[k]=sorted[p]===k});
  const ok=G.ord.every((k,p)=>sorted[p]===k);
  drawOrder(res);finish(ok,'',G.ord.map(k=>q.events[k][1]).join(' → '));
}
function hintSteps(q){
  const out=[];const memo=memoOf(q);
  if(memo)out.push({t:'Le rappel',h:memo.replace(/<h3>.*?<\/h3>/,'')});
  const M=(typeof METHODS!=='undefined'&&METHODS[q.modId||G.mod.id])||'';
  if(M)out.push({t:'La méthode',h:M});
  if(q.hint)out.push({t:'Un dessin pour t\u2019aider',h:q.hint});
  return out;
}
function injectHints(body,hb){
  if(!hb)return body;const i=body.indexOf('<div class="qcard">');if(i<0)return body+hb;
  // insère les indices à la fin de la carte de question (avant sa fermeture)
  let depth=0,j=i;const re=/<\/?div\b[^>]*>/g;re.lastIndex=i;let m;
  while((m=re.exec(body))){if(m[0].startsWith('</'))depth--;else depth++;if(depth===0){j=m.index;break}}
  return body.slice(0,j)+hb+body.slice(j);
}
function showHint(){

  const b=document.querySelector('[data-act="hint"]');if(b){if(G.hintN>=hs.length)b.remove();else b.textContent=`Encore un coup de pouce (${G.hintN+1}/${hs.length})`}

function pad(withOk){

}
function numKey(v){
  if(G.locked)return;const q=G.qs[G.i];
  if(v==='ok'){if(!G.input||G.input===',')return;const val=parseFloat(G.input.replace(',','.'));const ok=Math.abs(val-q.answer)<1e-9;

function drawPosed(){
  const q=G.qs[G.i], W=Math.max(len(q.a),len(q.b),len(q.r))+1;
  const cell=(c,cls='')=>`<div class="pc ${cls}">${c}</div>`;
  const row=(fn,cls='')=>`<div class="prow ${cls}">${Array.from({length:W},(_,j)=>fn(W-1-j,j)).join('')}</div>`;
  const doneCarry=i=>(i>0&&G.done.length>=i&&q.steps[i-1].co)?q.steps[i-1].co:'';
  let h='';
  if(q.t!=='sub') h+=row(i=>cell(doneCarry(i)||'','carry'));
  h+=row(i=>{if(i>=len(q.a))return cell('');const d=dg(q.a,i);const sub=q.t==='sub'&&G.done.length>i&&q.steps[i].co?'<sup>1</sup>':'';return cell(sub+d)});
  h+=row((i,j)=>{if(j===0)return cell(q.sym);if(i>=len(q.b))return cell('');return cell(dg(q.b,i))});
  if(q.t==='sub') h+=row(i=>cell(doneCarry(i)?'+1':'','under'));
  h+=row((i,j)=>{if(j===0)return cell('');if(i>=len(q.r))return cell('');
    if(i<G.done.length)return cell(q.steps[i].d,'res done');
    return cell('',`res ${i===G.done.length?'act':''}`)},'line');
  document.getElementById('posed').innerHTML=h;
}
function posedKey(v){

    if(G.done.length===q.steps.length){finish(!G.auto,G.auto?'':G.err?`Bravo, tu t'es corrigé tout seul en route (${G.err} chiffre${G.err>1?'s':''} à reprendre). Relis bien les colonnes ci-dessous.`:'')}
    return;}
  G.err++;G.colErr++;sBad();poke(document.getElementById('mascot'),'sad','sad');
  hint.hidden=false;hint.innerHTML=(G.colErr>=2?'Regarde bien : ':'Pas tout à fait. ')+st.h;

function answerLabel(q){

  if(q.type==='maptap')return q.answerLabel;

  keyHandler=null;setAccent('mo');
  const ws=weekStats(), L=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const rows=ws.ds.map((d,k)=>{const r=P.days[d]||{ms:0,q:0,ok:0};return `<tr><td>${L[k]}</td><td>${Math.floor(r.ms/60000)} min</td><td>${r.q}</td><td>${r.q?pctOf(r)+' %':'—'}</td><td>${dayMet(r)?'✓':''}</td></tr>`}).join('');
  const w=ws.w, S=P.set;
  const hist=Object.entries(P.weeks).filter(([k,v])=>v.choice&&k!==weekId()).sort().reverse().slice(0,6).map(([k,v])=>`<li>Semaine du ${k} : ${esc(v.choice)} ${v.given?'(remis)':'(à remettre)'}</li>`).join('');
  $app.innerHTML=`<div class="top"><button class="iconbtn" data-act="home">← Retour</button><div class="title">Espace parents</div></div>
  <div class="qcard"><div class="kicker">Cette semaine</div>
   <div class="tablewrap"><table class="ptable"><tr><th>Jour</th><th>Temps</th><th>Questions</th><th>Réussite</th><th>Objectif</th></tr>${rows}
   <tr><th>Total</th><th>${Math.floor(ws.ms/60000)} min</th><th>${ws.q}</th><th>${ws.q?ws.pct+' %':'—'}</th><th>${ws.won} / ${S.wdays}</th></tr></table></div>
   <p>${w.unlocked?`Cadeau de la semaine <b>gagné</b>${w.choice?` · choix de ${NAME} : <b>${esc(w.choice)}</b>`:' · '+NAME+' n’a pas encore choisi'}.`:`Cadeau de la semaine pas encore gagné (il faut ${S.wdays} jours réussis et ${S.wpct} % de réussite sur la semaine${S.parentOk?', plus votre validation':''}).`}</p>
   ${S.parentOk?`<label class="ck" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="pok" ${w.pok?'checked':''} data-act="pok"> Les notes de l'école sont bonnes cette semaine (validation parent)</label>`:''}
   ${w.choice?`<div class="row" style="justify-content:flex-start"><button class="btn ${w.given?'ghost':''}" data-act="given">${w.given?'Marquer comme non remis':'Cadeau remis'}</button></div>`:''}
   ${hist?`<div class="kicker" style="margin-top:12px">Semaines précédentes</div><ul>${hist}</ul>`:''}</div>
  <form class="qcard pform" id="pform" style="margin-top:14px"><div class="kicker">Objectifs et récompenses</div>
   <label>Temps de travail par jour (minutes)<input type="number" id="s-min" min="5" max="90" value="${S.min}"></label>
   <label>Réussite minimale par jour (%)<input type="number" id="s-pct" min="30" max="100" value="${S.pct}"></label>
   <label>Récompense du jour<input type="text" id="s-daily" value="${esc(S.daily)}"></label>
   <label>Jours réussis nécessaires dans la semaine<input type="number" id="s-wd" min="1" max="7" value="${S.wdays}"></label>
   <label>Réussite minimale sur la semaine (%)<input type="number" id="s-wpct" min="30" max="100" value="${S.wpct}"></label>
   <label class="ck"><input type="checkbox" id="s-lvl" ${(S.level||'ce1')==='defi'?'checked':''}> Niveau défi : environ un tiers des questions vont plus loin (nombres jusqu'à 999, tables de 3 à 9, heure à 5 minutes près, problèmes en deux étapes)</label>
   <label class="ck"><input type="checkbox" id="s-pok" ${S.parentOk?'checked':''}> Le cadeau de la semaine demande aussi ma validation (notes de l'école)</label>
   <label>Choix de cadeaux de la semaine (un par ligne)<textarea id="s-gifts" rows="5">${esc(S.gifts)}</textarea></label>
   <label>Nouveau code parent (laisser vide pour garder l'actuel)<input type="text" inputmode="numeric" maxlength="4" id="s-pin" placeholder="4 chiffres"></label>
   <div class="row" style="justify-content:flex-start"><button class="btn" type="submit">Enregistrer</button></div>${msg?`<div class="toast">${msg}</div>`:''}</form>
  <div class="qcard" style="margin-top:14px"><div class="kicker">Remise à zéro</div><p>Efface toutes les étoiles, les compagnons, la carte, l'historique et les réglages sur cet appareil.</p>
   <div id="resetzone"><button class="btn ghost" data-act="reset1">Tout effacer…</button></div></div>`;
}
function saveSettings(){
  const v=id=>document.getElementById(id).value, n=(id,a,b,d)=>{const x=parseInt(v(id),10);return isNaN(x)?d:Math.max(a,Math.min(b,x))};
  const S=P.set;S.min=n('s-min',5,90,S.min);S.pct=n('s-pct',30,100,S.pct);S.wdays=n('s-wd',1,7,S.wdays);S.wpct=n('s-wpct',30,100,S.wpct);
  S.daily=v('s-daily').trim()||DEF_SET.daily;S.gifts=v('s-gifts').trim()||DEF_SET.gifts;S.parentOk=document.getElementById('s-pok').checked;S.level=document.getElementById('s-lvl').checked?'defi':'ce1';
  const pin=v('s-pin').trim();let m='Réglages enregistrés.';
  if(pin){if(/^\d{4}$/.test(pin)){P.pin=pin;m+=' Nouveau code parent enregistré.'}else m='Le code parent doit contenir exactement 4 chiffres. Les autres réglages sont enregistrés.'}
  save();parentScreen(m);
}

/* ============ Confetti ============ */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('confetti');c.hidden=false;const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=['--fr','--ma','--sun','--good','--mo'].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:130},()=>({x:c.width/2,y:c.height/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,s:ri(6,11),c:pick(cols),r:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,p.s/2,p.s/3,0,0,7);x.fill();x.restore()});
    if(++f<120)requestAnimationFrame(loop);else{x.clearRect(0,0,c.width,c.height);c.hidden=true}})();
}

/* ============ Events ============ */
document.addEventListener('click',e=>{
  const sq=e.target.closest('.sqw:not(.locked)');
  if(sq&&!e.target.closest('[data-act]')){poke(sq,'squish','happy');sBoing();
    if(sq.dataset.comp){P.companion=+sq.dataset.sq;save();setTimeout(home,500)}return}
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='open'){const id=t.dataset.id;if(id==='calc'&&typeof openCalc==='function')openCalc();else if(typeof LEVELS!=='undefined'&&LEVELS[id])levelSetup(id);else id==='tables'?tablesSetup():id==='cartes'?cartesSetup():start(id)}
  else if(a==='calc')openCalc();
  else if(a==='calcclose')closeCalc();
  else if(a==='ck')calcKey(t.dataset.v);
  else if(a==='lvl'){(P.lv=P.lv||{})[t.dataset.id]=+t.dataset.l;save();levelSetup(t.dataset.id)}
  else if(a==='lvlgo')start(t.dataset.id);
  else if(a==='hint'){showHint()}
  else if(a==='say')say(t.dataset.w);
  else if(a==='hunt'){if(G.locked)return;const k=+t.dataset.k;if(G.sel.has(k))G.sel.delete(k);else G.sel.add(k);t.classList.toggle('sel');beep([[520,.04]])}
  else if(a==='huntok'){if(G.locked)return;const q=G.qs[G.i];const want=new Set(q.cells.map((c,k)=>c===q.target?k:-1).filter(k=>k>=0));
    const ok=want.size===G.sel.size&&[...want].every(k=>G.sel.has(k));const miss=[...want].filter(k=>!G.sel.has(k)).length, extra=[...G.sel].filter(k=>!want.has(k)).length;
    document.querySelectorAll('.hcell').forEach((b,k)=>{b.disabled=true;if(want.has(k))b.classList.add(G.sel.has(k)?'ok':'miss');else if(G.sel.has(k))b.classList.add('ko')});
    finish(ok,ok?'':`${extra?`Tu as touché ${extra} lettre${extra>1?'s':''} qui n'étai${extra>1?'en':''}t pas des « ${q.target} » (en rouge). `:''}${miss?`Il en manquait ${miss} (entourée${miss>1?'s':''}).`:''}`,`${G.sel.size} lettres touchées`)}
  else if(a==='home'){if(typeof CALC!=='undefined')closeCalc();stopTimers();document.querySelectorAll('.sheet').forEach(s=>s.remove());home()}
  else if(a==='sound'){P.sound=!P.sound;save();home()}
  else if(a==='table'){tableChoice=t.dataset.t==='mix'?'mix':+t.dataset.t;start('tables')}
  else if(a==='chrono')startChrono();
  else if(a==='choose')choose(+t.dataset.k);
  else if(a==='chunk')chunk(+t.dataset.k);
  else if(a==='tick')tick(+t.dataset.k);
  else if(a==='ord')ordTap(+t.dataset.k);
  else if(a==='ordreset'){if(!G.locked){G.ord=[];drawOrder()}}
  else if(a==='key'){keyHandler&&keyHandler(t.dataset.v)}
  else if(a==='next')next();
  else if(a==='memo'){G.memo=!G.memo;const m=document.querySelector('#app > .memo');if(m)m.remove();else{const d=document.createElement('div');d.className='memo';d.innerHTML=memoOf(G.qs[G.i]);$app.appendChild(d)}t.setAttribute('aria-pressed',G.memo)}
  else if(a==='replay'){G.mod.id==='revision'?startRevision():start(G.mod.id)}
  else if(a==='ovclose'){closeOverlay();if(!G)home()}
  else if(a==='giftpick')giftPicker(false);
  else if(a==='gift')chooseGift(+t.dataset.k);
  else if(a==='parent')parentGate();
  else if(a==='carnet')carnetScreen();
  else if(a==='revplay')startRevision();
  else if(a==='cartes')cartesSetup();
  else if(a==='cartesplay')start('cartes');
  else if(a==='explore')explore(t.dataset.m);
  else if(a==='mexp'){explore(EXP.m,t.dataset.id);beep([[620,.06]])}
  else if(a==='mtap')mtap(t.dataset.id);
  else if(a==='qreg'){const i=+t.dataset.i,o=new Set(REG_ORDER.slice(0,regionsOpen())).has(i);const el=document.getElementById('qinfo');if(el)el.innerHTML=o?`<b>${REG[i].n}</b> : région découverte !`:`Région encore dans le brouillard. Gagne des étoiles pour la découvrir !`;beep([[o?660:300,.08]])}
  else if(a==='pok'){wrec().pok=t.checked;save();parentScreen();if(weekStats().met&&!wrec().unlocked){wrec().unlocked=true;save()}}
  else if(a==='given'){const w=wrec();w.given=!w.given;save();parentScreen()}
  else if(a==='reset1'){document.getElementById('resetzone').innerHTML=`<p><b>Sûr ? Tout sera effacé sur cet appareil.</b></p><div class="row" style="justify-content:flex-start"><button class="btn danger" data-act="reset2">Oui, tout effacer</button><button class="btn ghost" data-act="parentback">Annuler</button></div>`}
  else if(a==='reset2'){try{localStorage.removeItem(KEY);localStorage.removeItem('jade-atelier-v1')}catch(e){}P={stars:0,best:{},chrono:0,sound:true,companion:0,days:{},weeks:{},pin:'',carnet:[],set:Object.assign({},DEF_SET)};save();home()}
  else if(a==='parentback')parentScreen();
});
document.addEventListener('submit',e=>{if(e.target.id==='pform'){e.preventDefault();saveSettings()}});
document.addEventListener('keydown',e=>{
  if(typeof CALC!=='undefined'&&CALC.open&&!/INPUT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName)){let v=null;
    if(/^[0-9]$/.test(e.key))v=e.key;else if(e.key==='+')v='+';else if(e.key==='-')v='-';else if(e.key==='Backspace')v='⌫';else if(e.key==='Enter'||e.key==='=')v=CALC.stage==='compose'?'=':CALC.stage==='answer'?'ok':'new';else if(e.key==='Escape'){closeCalc();return}
    if(v){e.preventDefault();calcKey(v)}return}
  if(!keyHandler||overlayOpen||/INPUT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName))return;let v=null;
  if(/^[0-9]$/.test(e.key))v=e.key;else if(e.key===','||e.key==='.')v=',';else if(e.key==='Backspace')v='⌫';else if(e.key==='Enter')v='ok';
  if(v){e.preventDefault();keyHandler(v)}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.getP=()=>P;
window.onRemoteState=function(st){P=Object.assign({},P,st);P.set=Object.assign({},DEF_SET,st.set||{});try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){};if(!G)home()};
home();
if(window.SYNC)window.SYNC.init();

</script>
