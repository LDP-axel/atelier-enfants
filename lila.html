<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/lila-180.png">
<link rel="icon" type="image/png" href="icons/lila-180.png">
<link rel="manifest" href="manifest-lila.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lila">
<title>Le Club de Lila</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centered column (max 760px); home = two "ateliers" of module tiles + sticker album; game = top bar, question card, answer zone, bottom sheet feedback */
:root{
  --bg:#E8F3F1; --card:#FFFFFF; --ink:#1D2433; --muted:#5A6A78; --line:#CFE0DD;
  --fr:#F2643F; --fr-soft:#FDE3D9; --ma:#0E8F80; --ma-soft:#D2F0EA;
  --sun:#F7B500; --sun-soft:#FFF1C7; --good:#22994A; --good-soft:#DDF4E3; --bad:#D93F45; --bad-soft:#FBE0E0;
  --shadow:0 2px 0 rgba(29,36,51,.08);
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A26; --card:#1B2535; --ink:#EEF2F7; --muted:#9BA9BA; --line:#2D3A4F;
  --fr:#FF8661; --fr-soft:#3A2622; --ma:#35C7B3; --ma-soft:#16332F;
  --sun:#FFC93D; --sun-soft:#3A3218; --good:#4CC86E; --good-soft:#173324; --bad:#FF6B70; --bad-soft:#3A1E22;
  --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121A26; --card:#1B2535; --ink:#EEF2F7; --muted:#9BA9BA; --line:#2D3A4F;
  --fr:#FF8661; --fr-soft:#3A2622; --ma:#35C7B3; --ma-soft:#16332F;
  --sun:#FFC93D; --sun-soft:#3A3218; --good:#4CC86E; --good-soft:#173324; --bad:#FF6B70; --bad-soft:#3A1E22;
  --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#app{max-width:760px;margin:0 auto;padding-block:18px 120px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sub{color:var(--muted)}
/* Home */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font-size:2.3rem;line-height:1.1}
.hello h1 span{color:var(--fr)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chip .ic{color:var(--sun)}
.iconbtn{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700}
.atelier{margin-top:22px}
.atelier-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.atelier-head h2{font-size:1.5rem}
.fr .atelier-head h2{color:var(--fr)} .ma .atelier-head h2{color:var(--ma)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.glyph{flex:none;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.fr .glyph{background:var(--fr-soft);color:var(--fr)} .ma .glyph{background:var(--ma-soft);color:var(--ma)}
.tile h3{font-size:1.15rem}
.tile p{margin:2px 0 4px;font-size:.92rem;color:var(--muted)}
.tile>div{min-width:0}
.crowns{display:flex;gap:3px}
.crowns i{width:16px;height:16px;border-radius:50%;background:var(--line);display:block}
.crowns i.on{background:var(--sun)}
.album{margin-top:28px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.album h2{font-size:1.35rem}
.stickers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:480px){.stickers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stk{aspect-ratio:1;max-width:100%;border-radius:14px;display:grid;place-items:center;font-size:2rem;background:var(--sun-soft);border:2px solid var(--sun)}
.stk.lock{background:var(--bg);border:2px dashed var(--line);color:var(--muted);font-size:1.1rem;font-family:var(--f-display)}
.bar{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>b{display:block;height:100%;background:var(--sun);border-radius:99px}
.parents{margin-top:18px;font-size:.88rem;color:var(--muted)}
/* Game */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .title{font-family:var(--f-display);font-weight:600;font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;gap:4px;margin-bottom:16px}
.prog i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.prog i.ok{background:var(--good)} .prog i.ko{background:var(--bad)} .prog i.cur{background:var(--sun)}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-bottom:6px}
.prompt{font-size:1.25rem}
.prompt b{color:var(--accent)}
.big{font-family:var(--f-display);font-size:2rem;font-weight:600;margin-top:10px;line-height:1.2}
.hl{background:var(--sun-soft);border-bottom:3px solid var(--sun);padding:0 4px;border-radius:4px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:480px){.opts.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 10px;font-family:var(--f-display);font-size:1.25rem;font-weight:600;min-height:62px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.ko{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.chunks{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:1.25rem}
.chunk{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700}
button.chunk:hover:not(:disabled){border-color:var(--accent)}
.chunk.hl2{background:var(--sun-soft);border-color:var(--sun)}
.chunk.ok{background:var(--good-soft);border-color:var(--good)}
.chunk.ko{background:var(--bad-soft);border-color:var(--bad)}
.answer{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:2rem;font-weight:600}
.slot{min-width:120px;padding:6px 16px;border-radius:14px;border:3px solid var(--accent);background:var(--bg);text-align:center;font-variant-numeric:tabular-nums;min-height:58px}
.slot.empty{color:var(--muted)}
.slot.ok{border-color:var(--good);background:var(--good-soft)}
.slot.ko{border-color:var(--bad);background:var(--bad-soft)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px auto 0;max-width:340px}
.pad button{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;font-family:var(--f-display);font-size:1.6rem;font-weight:600;height:58px}
.pad button:active{transform:translateY(2px)}
.pad .okk{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#fff}
.svgwrap{margin-top:12px;overflow-x:auto}
.svgwrap svg{display:block;width:100%;height:auto;min-width:340px}
.tick-hit{cursor:pointer}
.tick-hit:hover rect{fill:var(--sun-soft)}
/* Posed operations */
.posed{display:grid;justify-content:center;margin:14px auto 0;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.prow{display:flex}
.pc{width:46px;height:50px;display:grid;place-items:center;font-size:1.9rem}
.pc.carry{height:26px;font-size:1rem;color:var(--bad)}
.pc.under{height:22px;font-size:.9rem;color:var(--bad)}
.prow.line .pc{border-top:3px solid var(--ink)}
.pc.res{border:2px dashed var(--line);border-radius:10px;margin:2px;width:42px;height:46px}
.pc.res.act{border:3px solid var(--accent);background:var(--sun-soft)}
.pc.res.done{border-style:solid;border-color:var(--good);color:var(--good)}
.pc.res.shake{animation:shake .35s}
.pc sup{font-size:.9rem;color:var(--bad);margin-right:1px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{margin-top:12px;background:var(--sun-soft);border-radius:14px;padding:10px 14px;font-size:1rem}
/* Feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:3px solid;animation:up .2s ease-out}
.sheet .in{max-width:760px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sheet .msg{flex:1;min-width:220px}
.sheet h3{font-size:1.5rem}
.sheet.good{background:var(--good-soft);border-color:var(--good)} .sheet.good h3{color:var(--good)}
.sheet.bad{background:var(--bad-soft);border-color:var(--bad)} .sheet.bad h3{color:var(--bad)}
.sheet p{margin:4px 0 0}
.btn{background:var(--accent);color:#fff;border-radius:16px;padding:14px 22px;font-family:var(--f-display);font-weight:600;font-size:1.2rem;border-bottom:4px solid rgba(0,0,0,.2)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
/* Memo */
.memo{margin-top:14px;background:var(--card);border:2px dashed var(--accent);border-radius:18px;padding:14px 18px}
.memo h3{color:var(--accent);font-size:1.2rem;margin-bottom:6px}
.memo ul{margin:0;padding-left:20px}.memo li{margin-bottom:4px}
.memo table{border-collapse:collapse;font-size:.95rem}.memo td{padding:2px 8px 2px 0}
.memo .t{color:var(--fr);font-weight:700}
/* Setup + end */
.center{text-align:center}
.endcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:28px 20px;text-align:center}
.endcard h1{font-size:2.2rem}
.bigcrowns{display:flex;justify-content:center;gap:12px;margin:16px 0}
.bigcrowns i{width:46px;height:46px;border-radius:50%;background:var(--line);display:block;transform:scale(.8)}
.bigcrowns i.on{background:var(--sun);animation:pop .4s backwards}
.bigcrowns i.on:nth-child(2){animation-delay:.15s}.bigcrowns i.on:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.newstk{margin-top:14px;background:var(--sun-soft);border-radius:16px;padding:12px;font-weight:700}
.newstk span{font-size:2.6rem;display:block}
.tablegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.timer{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}
.timer b{display:block;height:100%;background:var(--sun);transition:width 1s linear}
.flash-ok{animation:fok .4s}.flash-ko{animation:fko .5s}
@keyframes fok{50%{background:var(--good-soft)}}@keyframes fko{50%{background:var(--bad-soft)}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v2 additions: monde atelier, squishies, objectifs, parents ---- */
:root{--mo:#3F6FD8;--mo-soft:#DCE6FB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--mo:#86A8FF;--mo-soft:#1E2A47}}
:root[data-theme="dark"]{--mo:#86A8FF;--mo-soft:#1E2A47}
:root{--en:#8A4FD0;--en-soft:#EEE3FB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--en:#B98CF0;--en-soft:#2C2140}}
:root[data-theme="dark"]{--en:#B98CF0;--en-soft:#2C2140}
.en .glyph{background:var(--en-soft);color:var(--en)} .en .atelier-head h2{color:var(--en)}
.enbtn{margin-top:10px;font:inherit;font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;border:2px solid var(--en);background:var(--en-soft);color:var(--ink);cursor:pointer}
.mo .glyph{background:var(--mo-soft);color:var(--mo)} .mo .atelier-head h2{color:var(--mo)}
.sqw{display:inline-block;transform-origin:50% 92%;animation:breathe 2.8s ease-in-out infinite;cursor:pointer;line-height:0}
.sqw svg{display:block;width:100%;height:auto;overflow:visible}
.sqw.locked{filter:grayscale(1);opacity:.28;animation:none;cursor:default}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
.sqw.squish{animation:squish .7s cubic-bezier(.28,1.5,.5,1)}
@keyframes squish{0%{transform:scale(1,1)}25%{transform:scale(1.32,.66)}55%{transform:scale(.86,1.16)}80%{transform:scale(1.06,.95)}100%{transform:scale(1,1)}}
.sqw.jump{animation:jump .8s ease}
@keyframes jump{0%{transform:translateY(0) scale(1.18,.82)}35%{transform:translateY(-30%) scale(.9,1.12)}70%{transform:translateY(0) scale(1.22,.8)}100%{transform:none}}
.sqw.sad{animation:wob .7s}
@keyframes wob{20%{transform:rotate(-9deg) scale(1.05,.95)}50%{transform:rotate(8deg)}80%{transform:rotate(-3deg)}}
.sqw.dance{animation:dance 1.1s ease-in-out infinite}
.sqw.dance:nth-child(2){animation-delay:.2s}.sqw.dance:nth-child(3){animation-delay:.4s}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0) scale(1)}25%{transform:translateY(-14%) rotate(-7deg) scale(.94,1.07)}50%{transform:translateY(0) scale(1.16,.85)}75%{transform:translateY(-14%) rotate(7deg) scale(.94,1.07)}}
.hello{align-items:center}
.hello-l{display:flex;gap:12px;align-items:center;min-width:0}
.hello-l .sqw{width:84px;flex:none}
.goal{margin-top:6px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px}
.goal h2{font-size:1.3rem}
.meter{display:grid;gap:4px}
.meter .lab{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.meter .trk{position:relative;height:16px;border-radius:99px;background:var(--bg);overflow:hidden}
.meter .trk b{display:block;height:100%;border-radius:99px;background:var(--ma)}
.meter .trk b.pct{background:var(--fr)}
.meter .trk i{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);opacity:.5}
.goal .status{font-weight:700}
.goal .status.won{color:var(--good)}
.week{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.day{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;border:2px solid var(--line);background:var(--bg);color:var(--muted)}
.day.played{border-color:var(--sun);color:var(--ink)}
.day.won{background:var(--sun);border-color:var(--sun);color:#3B2F00}
.day.today{outline:3px solid var(--accent);outline-offset:2px}
.giftline{font-size:.95rem}
.coll{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:480px){.coll{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cslot{display:grid;justify-items:center;gap:2px;background:var(--bg);border-radius:16px;padding:8px 4px;border:2px solid transparent;text-align:center}
.cslot.comp{border-color:var(--sun);background:var(--sun-soft)}
.cslot .sqw{width:100%;max-width:72px}
.cslot small{font-size:.75rem;font-weight:700;color:var(--muted)}
.top .mascot{width:44px;flex:none}
.top .chip{font-size:.85rem;padding:4px 10px}
.sheet .sqw{width:64px;flex:none}
.overlay{position:fixed;inset:0;z-index:25;background:rgba(18,26,38,.55);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.ovcard{background:var(--card);border-radius:26px;padding:24px 20px;max-width:460px;width:100%;text-align:center;border:3px solid var(--sun);max-height:90vh;overflow:auto}
.ovcard h1{font-size:1.8rem;color:var(--ink)}
.ovcard .band{display:flex;justify-content:center;gap:6px;margin:10px 0}
.ovcard .band .sqw{width:90px}
.reward{background:var(--sun-soft);border-radius:16px;padding:12px;margin:12px 0;font-weight:700}
.giftopts{display:grid;gap:8px;margin-top:12px}
.ordcards{display:grid;gap:8px;margin-top:14px}
.ord{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700;font-size:1.05rem}
.ord .n{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px dashed var(--line);font-family:var(--f-display)}
.ord.sel .n{background:var(--accent);border:none;color:#fff}
.ord.ok{border-color:var(--good);background:var(--good-soft)} .ord.ko{border-color:var(--bad);background:var(--bad-soft)}
.pform{display:grid;gap:12px;margin-top:10px}
.pform label{display:grid;gap:4px;font-weight:700;font-size:.95rem}
.pform input,.pform textarea{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.pform .ck{display:flex;gap:10px;align-items:center;font-weight:400}
.pform .ck input{width:auto}
.ptable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
.ptable th,.ptable td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.tablewrap{overflow-x:auto}
.toast{margin-top:8px;color:var(--good);font-weight:700}
.linkbtn{color:var(--muted);text-decoration:underline;font-size:.9rem;padding:4px}
.danger{background:var(--bad)}

.newstk .sqw{display:inline-block}
/* ---- v3: explications, carnet, cartes ---- */
:root{--sea:#CDE6F4;--land:#E3F0D2;--other:#ECE8DF;--mount:#B88A5C;--river:#2C7FC9;--mapline:#5B6B5B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sea:#1C3550;--land:#2C4A33;--other:#2A303B;--mount:#C9A27A;--river:#6CB6F2;--mapline:#9FB59F}}
:root[data-theme="dark"]{--sea:#1C3550;--land:#2C4A33;--other:#2A303B;--mount:#C9A27A;--river:#6CB6F2;--mapline:#9FB59F}
.sheet{max-height:72vh;overflow-y:auto}
.sheet .in{align-items:flex-start}
.sheet .btn{position:sticky;bottom:0}
.fb{font-size:1rem;margin-top:6px}
.fbtitle{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;color:var(--muted);margin:10px 0 4px}
.fbline{margin:2px 0}
.fbline s{color:var(--bad)}
.why{background:var(--card);border-left:4px solid var(--bad);border-radius:8px;padding:8px 10px;margin:8px 0}
.rule{background:var(--card);border-radius:10px;padding:8px 10px;margin:8px 0;border:1px solid var(--line)}
table.cj{border-collapse:collapse;margin-top:4px;font-size:.98rem}
table.cj td{padding:2px 12px 2px 0}
table.cj tr.me td{font-weight:700;color:var(--accent)}

<div id="app"></div>

<script>
window.CALC_OPS=["+","−","×"];window.CALC_DIGITS=4;
/* ============ Utils ============ */
const $app = document.getElementById('app');
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const r2 = x=>Math.round(x*100)/100;
const fmt = x=>r2(x).toLocaleString('fr-FR',{maximumFractionDigits:2}).replace(/[  ]/g,' ');
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ Dates ============ */
const dkey=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const today=()=>dkey();
function weekDays(){const d=new Date();const off=(d.getDay()+6)%7;return Array.from({length:7},(_,k)=>dkey(new Date(d.getFullYear(),d.getMonth(),d.getDate()-off+k)))}
const weekId=()=>weekDays()[0];

/* ============ Storage ============ */
const KEY='lila-club-v1';
const DEF_SET={min:20,pct:70,wdays:5,wpct:75,parentOk:false,daily:"Une petite récompense choisie avec Maman (dessert, temps de jeu…)",gifts:"Une séance de tennis avec Maman\nUn match de foot au parc\nDes poignets éponge\nUn poster de sport\nUn cinéma"};
let P={stars:0,best:{},chrono:0,sound:true,companion:0,days:{},weeks:{},pin:'',carnet:[],set:Object.assign({},DEF_SET)};
try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s){P=Object.assign(P,s);P.set=Object.assign({},DEF_SET,s.set||{})}
  else{const o=null;if(o){P.stars=o.stars||0;P.best=o.best||{};P.chrono=o.chrono||0;P.sound=o.sound!==false}}
}catch(e){}
const save=()=>{P.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){};if(window.SYNC)window.SYNC.push(P)};
const rec=(d=today())=>(P.days[d]=P.days[d]||{ms:0,q:0,ok:0,won:false});
const wrec=(w=weekId())=>(P.weeks[w]=P.weeks[w]||{unlocked:false,choice:'',given:false,pok:false});
const pctOf=r=>r.q?Math.round(100*r.ok/r.q):0;
const dayMet=r=>!!r&&r.ms>=P.set.min*60000&&r.q>=10&&pctOf(r)>=P.set.pct;
function weekStats(){
  const ds=weekDays();let q=0,ok=0,won=0,ms=0;
  ds.forEach(d=>{const r=P.days[d];if(r){q+=r.q;ok+=r.ok;ms+=r.ms;if(dayMet(r))won++}});
  const pct=q?Math.round(100*ok/q):0, w=wrec();
  const met=won>=P.set.wdays&&pct>=P.set.wpct&&(!P.set.parentOk||w.pok);
  return {ds,q,ok,won,ms,pct,met,w};
}

/* ============ Sound ============ */
let AC=null;
function beep(seq,type='triangle'){if(!P.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d,f2])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8;})}catch(e){}}
const sGood=()=>beep([[660,.12],[880,.18]]), sBad=()=>beep([[240,.22]]), sWin=()=>beep([[523,.12],[659,.12],[784,.12],[1047,.3]]);
const sBoing=()=>beep([[180,.28,520]],'sine');

/* ============ Mes champions (personnages originaux) ============ */
const INK='#3B2F2F';
const SQ=[
 {n:'Balle',k:'tball',c:'#D7E94A',d:'#FFFFFF'},{n:'Ballon',k:'sball',c:'#FFFFFF',d:'#2B3A55'},{n:'Raquette',k:'racket',c:'#FFE6EC',d:'#E53950'},
 {n:'Maillot',k:'shirt',c:'#1F3C88',d:'#E53950'},{n:'Coupe',k:'cup',c:'#FFD54F',d:'#C9A227'},{n:'Médaille',k:'medal',c:'#FFC94D',d:'#3F6FD8'},
 {n:'Casquette',k:'cap',c:'#E53950',d:'#1F3C88'},{n:'Sifflet',k:'whistle',c:'#9FD8F5',d:'#3D4550'},{n:'Gourde',k:'bottle',c:'#A8E6A1',d:'#1F3C88'},
 {n:'Basket',k:'shoe',c:'#FFFFFF',d:'#E53950'},{n:'Minou',k:'cat',c:'#DCCBFF',d:'#FFB3C7'},{n:'Nounours',k:'bear',c:'#E9B98A',d:'#C68B59'},
 {n:'Lapinou',k:'bunny',c:'#FFF6EA',d:'#FFB3C7'},{n:'Panda',k:'panda',c:'#FFFFFF',d:'#3D4550'},{n:'Pingou',k:'peng',c:'#56688C',d:'#FFFFFF'},
 {n:'Étoile',k:'star',c:'#FFE27A',d:'#FFC107'},{n:'Hamster',k:'ham',c:'#FFCC80',d:'#FFF3E0'},{n:'Croa',k:'frog',c:'#A8E6A1',d:'#66BB6A'}
];
const PER=15;
const unlocked=()=>Math.min(SQ.length,1+Math.floor(P.stars/PER));
function face(x,y,m,o={}){
  const ex=o.ex||13, ey=o.ey??y, my=o.my??y+7, eye=o.eye||INK;
  let s='';
  if(m==='happy') s+=`<path d="M${x-ex-4} ${ey+2} q4 -7 8 0 M${x+ex-4} ${ey+2} q4 -7 8 0" stroke="${eye}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  else s+=`<circle cx="${x-ex}" cy="${ey}" r="4.3" fill="${eye}"/><circle cx="${x+ex}" cy="${ey}" r="4.3" fill="${eye}"/><circle cx="${x-ex+1.5}" cy="${ey-1.6}" r="1.4" fill="${eye===INK?'#fff':INK}"/><circle cx="${x+ex+1.5}" cy="${ey-1.6}" r="1.4" fill="${eye===INK?'#fff':INK}"/>`;
  if(m==='sad') s+=`<path d="M${x-5} ${my+4} q5 -5 10 0" stroke="${INK}" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M${x+ex+4} ${ey+5} q2 4 0 6 q-2 -2 0 -6z" fill="#7EC8F2"/>`;
  else if(m==='happy') s+=`<path d="M${x-6} ${my-1} q6 9 12 0 z" fill="#E5737F" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
  else s+=`<path d="M${x-6} ${my} q3 3 6 0 q3 3 6 0" stroke="${INK}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  s+=`<ellipse cx="${x-ex-9}" cy="${my}" rx="5.5" ry="3.2" fill="#FF8FA3" opacity=".6"/><ellipse cx="${x+ex+9}" cy="${my}" rx="5.5" ry="3.2" fill="#FF8FA3" opacity=".6"/>`;
  return s;
}
function sqBody(q,m){
  const S=`stroke="${INK}" stroke-width="2.5"`, c=q.c, d=q.d;
  const blob=`<ellipse cx="60" cy="72" rx="44" ry="38" fill="${c}" ${S}/>`;
  const shine=`<ellipse cx="38" cy="54" rx="8" ry="4.5" fill="#fff" opacity=".6" transform="rotate(-30 38 54)"/>`;
  switch(q.k){
    case 'bun': return `<ellipse cx="60" cy="78" rx="48" ry="32" fill="${c}" ${S}/><ellipse cx="34" cy="64" rx="9" ry="4.5" fill="#fff" opacity=".6" transform="rotate(-25 34 64)"/>`+face(60,76,m);
    case 'cat': return `<path d="M22 56 L28 18 L52 40 Z" fill="${c}" ${S}/><path d="M98 56 L92 18 L68 40 Z" fill="${c}" ${S}/><path d="M30 44 L32 28 L42 38Z" fill="${d}"/><path d="M90 44 L88 28 L78 38Z" fill="${d}"/>`+blob+shine+face(60,72,m);
    case 'bunny': return `<ellipse cx="42" cy="26" rx="9" ry="24" fill="${c}" ${S}/><ellipse cx="78" cy="26" rx="9" ry="24" fill="${c}" ${S}/><ellipse cx="42" cy="28" rx="4" ry="15" fill="${d}"/><ellipse cx="78" cy="28" rx="4" ry="15" fill="${d}"/>`+blob+face(60,72,m);
    case 'bear': return `<circle cx="28" cy="42" r="12" fill="${c}" ${S}/><circle cx="92" cy="42" r="12" fill="${c}" ${S}/><circle cx="28" cy="42" r="6" fill="${d}"/><circle cx="92" cy="42" r="6" fill="${d}"/>`+blob+`<ellipse cx="60" cy="84" rx="15" ry="10" fill="#FFF1E0"/>`+shine+face(60,70,m,{my:82});
    case 'panda': return `<circle cx="28" cy="42" r="12" fill="${d}" ${S}/><circle cx="92" cy="42" r="12" fill="${d}" ${S}/>`+blob+`<ellipse cx="46" cy="70" rx="8" ry="10" fill="${d}" transform="rotate(25 46 70)"/><ellipse cx="74" cy="70" rx="8" ry="10" fill="${d}" transform="rotate(-25 74 70)"/>`+face(60,70,m,{eye:'#fff',my:82});
    case 'uni': return `<path d="M30 50 L34 28 L50 40Z" fill="${c}" ${S}/><path d="M90 50 L86 28 L70 40Z" fill="${c}" ${S}/>`+blob+`<path d="M53 36 L60 4 L67 36 Z" fill="#FFD54F" ${S}/><circle cx="36" cy="44" r="9" fill="${d}"/><circle cx="46" cy="37" r="8" fill="#B3E5FC"/><circle cx="28" cy="55" r="7" fill="#FFCDD2"/>`+face(60,74,m);

    case 'dino': return `<path d="M34 42 L42 22 L50 38Z M52 36 L60 14 L68 36Z M70 38 L78 22 L86 42Z" fill="${d}" ${S} stroke-linejoin="round"/>`+blob+`<ellipse cx="60" cy="90" rx="22" ry="14" fill="#E0F7EF"/>`+face(60,70,m);
    case 'peng': return blob+`<ellipse cx="60" cy="80" rx="31" ry="28" fill="${d}"/><path d="M56 82 L64 82 L60 88Z" fill="#FFB74D"/>`+face(60,72,m,{my:80});
    case 'peach': return `<path d="M60 36 C40 14 10 30 16 66 C20 96 44 108 60 108 C76 108 100 96 104 66 C110 30 80 14 60 36 Z" fill="${c}" ${S}/><path d="M60 36 C62 20 76 14 86 18 C80 30 70 36 60 36 Z" fill="#81C784" ${S}/><path d="M60 38 C54 50 54 58 57 64" stroke="${d}" stroke-width="2.5" fill="none"/>`+face(60,76,m);
    case 'straw': return `<path d="M60 110 C28 100 12 70 20 50 C28 32 92 32 100 50 C108 70 92 100 60 110 Z" fill="${c}" ${S}/><path d="M36 42 L48 26 L60 36 L72 26 L84 42 L60 46 Z" fill="#66BB6A" ${S} stroke-linejoin="round"/>`+[[30,60],[90,60],[36,82],[84,82],[50,98],[70,98]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="2.2" ry="3.2" fill="${d}"/>`).join('')+face(60,66,m);
    case 'cloud': {const C=[[36,74,24],[60,58,30],[86,74,24],[48,88,22],[74,88,22]];return C.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="${INK}" stroke-width="5"/>`).join('')+C.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join('')+face(60,76,m)}
    case 'cake': return `<path d="M30 70 L90 70 L82 108 L38 108 Z" fill="${d}" ${S}/><path d="M46 72 L48 106 M60 72 L60 106 M74 72 L72 106" stroke="#fff" stroke-width="3" opacity=".6"/><path d="M18 74 C12 56 28 44 38 46 C42 28 78 28 82 46 C92 44 108 56 102 74 Z" fill="${c}" ${S}/><circle cx="60" cy="26" r="7" fill="#E53950" ${S}/>`+face(60,58,m);
    case 'avo': return `<ellipse cx="60" cy="70" rx="44" ry="42" fill="${d}" ${S}/><ellipse cx="60" cy="72" rx="35" ry="33" fill="${c}"/><circle cx="60" cy="88" r="12" fill="#A1785C" ${S}/>`+face(60,62,m,{my:69});
    case 'frog': return `<circle cx="38" cy="44" r="15" fill="${c}" ${S}/><circle cx="82" cy="44" r="15" fill="${c}" ${S}/><ellipse cx="60" cy="80" rx="48" ry="30" fill="${c}" ${S}/>`+face(60,44,m,{ex:22,my:82});
    case 'toast': return `<path d="M18 56 Q16 26 44 30 Q60 16 76 30 Q104 26 102 56 L100 102 Q100 108 94 108 L26 108 Q20 108 20 102 Z" fill="${d}" ${S}/><path d="M28 58 Q28 36 48 40 Q60 30 72 40 Q92 36 92 58 L92 98 L28 98 Z" fill="${c}"/>`+face(60,70,m);
    case 'star': {let p=[];for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?24:50;p.push((60+r*Math.cos(a)).toFixed(1)+','+(68+r*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${c}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`+face(60,68,m,{ex:10})}
    case 'boba': return `<rect x="64" y="2" width="9" height="40" rx="3" fill="#F48FB1" ${S}/><path d="M28 40 L92 40 L84 110 L36 110 Z" fill="${c}" ${S}/><ellipse cx="60" cy="40" rx="33" ry="8" fill="#FFFFFF" ${S}/>`+[[46,100],[58,102],[70,100],[52,92],[66,92],[78,96],[42,94]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="${d}"/>`).join('')+face(60,64,m);
    case 'tball': return blob+`<path d="M22 58 C40 66 40 92 30 102 M98 58 C80 66 80 92 90 102" stroke="${d}" stroke-width="5" fill="none" stroke-linecap="round"/>`+shine+face(60,72,m);
    case 'sball': return blob+`<polygon points="60,38 70,45 66,56 54,56 50,45" fill="${d}"/><polygon points="22,72 30,66 34,76 28,84 20,82" fill="${d}"/><polygon points="98,72 90,66 86,76 92,84 100,82" fill="${d}"/><polygon points="48,104 54,96 66,96 72,104 60,110" fill="${d}"/>`+face(60,76,m,{my:84});
    case 'racket': return `<rect x="55" y="86" width="10" height="30" rx="4" fill="${d}" ${S}/><ellipse cx="60" cy="50" rx="38" ry="42" fill="${c}" stroke="${d}" stroke-width="7"/><path d="M40 20 L40 82 M52 10 L52 92 M68 10 L68 92 M80 20 L80 82 M24 38 L96 38 M22 62 L98 62" stroke="${d}" stroke-width="1.2" opacity=".35"/>`+face(60,50,m);
    case 'shirt': return `<path d="M38 18 L22 26 L8 48 L26 58 L32 48 L32 110 L88 110 L88 48 L94 58 L112 48 L98 26 L82 18 Q60 34 38 18 Z" fill="${c}" ${S} stroke-linejoin="round"/><rect x="50" y="26" width="20" height="84" fill="${d}"/><path d="M38 18 Q60 34 82 18" fill="none" ${S}/>`+face(60,66,m);

function genAccords(){
  const [s,o,tip]=pick(ACC);
  const html=esc(s).replace('___','<span class="hl">___</span>');
  const verbe=o.length===2, plur=s.includes('→ des');
  const meth=verbe?'<b>Méthode :</b> je cherche le sujet (« C\u2019est … qui ») et j\u2019accorde le verbe avec lui, même s\u2019il est loin.'
    :plur?'<b>Méthode :</b> je regarde comment le mot se termine (-al, -eau, -ou, -eu, -s…) et j\u2019applique la règle du pluriel.'
    :'<b>Méthode :</b> 1. je trouve le nom · 2. masculin ou féminin ? singulier ou pluriel ? · 3. l\u2019adjectif prend le même genre et le même nombre.';
  const full=esc(s).replace(/\(.*?\)/,'').replace('___','<b>'+o[0]+'</b>').replace(/\s+\./,'.');
  return {key:'a'+s,type:'choice',kicker:'Les accords',prompt:`Choisis la bonne orthographe :<div class="big">${html}</div>`,options:shuffle(o),answer:o[0],four:o.length===4,
    explain:`On écrit : <b>${verbe?o[0]:full}</b><div class="rule">${tip}</div>${meth}`};
}

/* ============ LIGNE GRADUÉE ============ */
function genLigne(){
  const K=[
    ()=>({a:0,n:10,step:10}),()=>({a:100*ri(1,9),n:10,step:10}),()=>({a:100*ri(1,9),n:5,step:20}),
    ()=>({a:1000*ri(1,8),n:4,step:250}),()=>({a:50*ri(0,10),n:10,step:5}),()=>({a:ri(0,8),n:10,step:.1}),
    ()=>({a:0,n:10,step:50,labelAt:4}),()=>({a:1000*ri(1,9),n:10,step:100}),()=>({a:0,n:8,step:.25,frac:true})
  ];
  const c=pick(K)();
  const m=c.labelAt||c.n; c.labels={0:fmt(c.a)}; c.labels[m]=fmt(c.a+m*c.step);
  if(c.frac){c.labels={0:'0',4:'1',8:'2'}}
  const free=[];for(let k=1;k<c.n;k++)if(!(k in c.labels))free.push(k);
  const k=pick(free), val=r2(c.a+k*c.step);
  const diff=r2(m*c.step), b=r2(c.a+diff);
  let explain=c.frac?`L'unité (de 0 à 1) est coupée en <b>4</b> : chaque pas vaut <b>¼</b> (0,25). Le trait n°${k} vaut ${k} × 0,25 = <b>${fmt(val)}</b>.`
    :`Écart : ${fmt(b)} − ${fmt(c.a)} = ${fmt(diff)}. Il y a <b>${m}</b> intervalles, donc le pas = ${fmt(diff)} ÷ ${m} = <b>${fmt(c.step)}</b>.<br>Le trait n°${k} vaut ${fmt(c.a)} + ${k} × ${fmt(c.step)} = <b>${fmt(val)}</b>.`;
  explain+='<div class="rule"><b>Piège :</b> je compte les <b>espaces</b> entre les traits, pas les traits eux-mêmes. Et le pas ne vaut pas toujours 1 ou 10 : je le calcule.</div>';
  if(Math.random()<.5) return {key:'l'+c.a+c.n+k,type:'num',kicker:'Ligne graduée',prompt:c.frac?'Quel nombre décimal se cache sous le point d’interrogation ?':'Quel nombre se cache sous le point d’interrogation ?',visual:lineSVG(c,k,false),answer:val,explain,dec:!Number.isInteger(c.step)};
  return {key:'lp'+c.a+c.n+k,type:'tick',kicker:'Ligne graduée',prompt:`Touche le trait où se trouve <b>${fmt(val)}</b>.`,cfg:c,answerK:k,val,explain};
}
function lineSVG(c,qk,place,mark){
  const W=520,H=140,x0=34,x1=W-40,y=66,st=(x1-x0)/c.n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ligne graduée"><line x1="${x0-14}" y1="${y}" x2="${x1+22}" y2="${y}" stroke="var(--ink)" stroke-width="3"/><polygon points="${x1+30},${y} ${x1+18},${y-7} ${x1+18},${y+7}" fill="var(--ink)"/>`;
  for(let k=0;k<=c.n;k++){const x=x0+k*st;const lab=k in c.labels;const h=lab?18:(c.n>=10&&k%5===0?14:10);
    if(place) s+=`<g class="tick-hit" data-act="tick" data-k="${k}"><rect x="${x-st/2+2}" y="${y-36}" width="${st-4}" height="72" rx="8" fill="transparent"/></g>`;
    s+=`<line x1="${x}" y1="${y-h}" x2="${x}" y2="${y+h}" stroke="var(--ink)" stroke-width="${lab?3:2}" pointer-events="none"/>`;
    if(lab) s+=`<text x="${x}" y="${y+50}" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="26" font-weight="600" fill="var(--ma)" pointer-events="none">${c.labels[k]}</text>`;}
  if(qk!=null){const x=x0+qk*st;s+=`<text x="${x}" y="${y-32}" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="32" font-weight="700" fill="var(--fr)">?</text><line x1="${x}" y1="${y-26}" x2="${x}" y2="${y-8}" stroke="var(--fr)" stroke-width="3"/>`;}
  if(mark) mark.forEach(([k,col])=>{const x=x0+k*st;s+=`<polygon points="${x},${y-6} ${x-9},${y-26} ${x+9},${y-26}" fill="${col}"/>`;});
  return s+'</svg>';
}

/* ============ OPÉRATIONS POSÉES ============ */
const COLS=['Unités','Dizaines','Centaines','Milliers','Dizaines de milliers'];
const dg=(n,i)=>Math.floor(n/10**i)%10;
const len=n=>String(n).length;
function genPoser(){
  const t=pick(['add','add','sub','sub','mul','mul']);
  let a,b,r;
  if(t==='add'){a=ri(120,9999);b=ri(120,Math.min(9999,a<1000?999:9999));r=a+b}
  else if(t==='sub'){a=ri(400,9999);b=ri(100,a-100);r=a-b}
  else {a=ri(102,999);b=ri(3,9);r=a*b}
  const steps=[];let c=0;
  for(let i=0;i<len(r);i++){
    let d,h,co=0;
    if(t==='add'){const x=dg(a,i),y=dg(b,i),s=x+y+c;d=s%10;co=Math.floor(s/10);
      h=(i>=len(a)&&i>=len(b))?`Il reste la retenue : j'écris <b>${c}</b>.`:`${x} + ${y}${c?' + '+c+' (retenue)':''} = ${s} → j'écris <b>${d}</b>${co?', je retiens <b>1</b>':''}.`;}
    else if(t==='sub'){const x=dg(a,i),y=dg(b,i)+c;
      if(x<y){d=x+10-y;co=1;h=`${c?`En bas : ${dg(b,i)} + 1 (retenue) = ${y}. `:''}${x} est plus petit que ${y} : j'ajoute une dizaine en haut → ${x+10} − ${y} = <b>${d}</b>, et j'ajoute <b>+1</b> en bas sur la colonne suivante.`}
      else{d=x-y;h=`${c?`En bas : ${dg(b,i)} + 1 (retenue) = ${y}. `:''}${x} − ${y} = <b>${d}</b>.`}}
    else{const x=dg(a,i);if(i>=len(a)){d=c;h=`Il reste la retenue : j'écris <b>${c}</b>.`}else{const p=x*b+c;d=p%10;co=Math.floor(p/10);h=`${x} × ${b}${c?' + '+c+' (retenue)':''} = ${p} → j'écris <b>${d}</b>${co?`, je retiens <b>${co}</b>`:''}.`}}
    steps.push({d,h,co});c=co;
  }
  const sym={add:'+',sub:'−',mul:'×'}[t];
  return {key:'o'+a+t+b,type:'posed',kicker:{add:'Addition',sub:'Soustraction',mul:'Multiplication'}[t],t,a,b,r,sym,steps,
    explain:`${fmt(a)} ${sym} ${fmt(b)} = <b>${fmt(r)}</b><div class="rule"><b>Colonne par colonne, en partant de la droite :</b><ol class="steps">${steps.map((st,i)=>`<li><b>${COLS[i]||'colonne suivante'}</b> : ${st.h}</li>`).join('')}</ol></div><b>Vérifier :</b> ${t==='add'?`l'ordre de grandeur ${fmt(Math.round(a/100)*100)} + ${fmt(Math.round(b/100)*100)} ≈ ${fmt(Math.round(a/100)*100+Math.round(b/100)*100)}`:t==='sub'?`${fmt(r)} + ${fmt(b)} = ${fmt(a)}`:`${fmt(a)} ≈ ${fmt(Math.round(a/100)*100)}, et ${fmt(Math.round(a/100)*100)} × ${b} = ${fmt(Math.round(a/100)*100*b)}, c'est proche`}.`};
}

/* ============ TABLES ============ */
const tableLine=(x,y)=>`<div class="rule"><b>La table de ${x} :</b> ${Array.from({length:10},(_,k)=>k+1===y?`<b class="hlv">${x*(k+1)}</b>`:x*(k+1)).join(' · ')}</div>`;
const TABLE_TIP=(a,b)=>{const p=a*b,k=[a,b].sort().join('x');
  const T={'7x8':'5, 6, 7, 8 → 56 = 7 × 8','6x7':'6 × 7 = 42, le nombre préféré des robots !','6x8':'6 × 8 = 48 : double de 24','7x7':'7 × 7 = 49, juste avant 50','8x8':'8 × 8 = 64','6x9':'Table de 9 : 6 × 10 − 6 = 54','7x9':'Table de 9 : 7 × 10 − 7 = 63','8x9':'Table de 9 : 8 × 10 − 8 = 72'};
  if(T[k])return T[k];
  if(a===9||b===9){const n=a===9?b:a;return `Table de 9 : ${n} × 10 − ${n} = ${p}`}
  if(a===5||b===5){const n=a===5?b:a;return `× 5 = moitié de × 10 : ${n*10} ÷ 2 = ${p}`}
  if(a===4||b===4){const n=a===4?b:a;return `× 4 = double du double : ${n} → ${n*2} → ${p}`}
  return `Retiens : ${a} × ${b} = ${p} (et ${b} × ${a} aussi !)`;};
let tableChoice='mix';
function genTables(){
  const a=tableChoice==='mix'?ri(2,9):tableChoice, b=ri(2,10);
  const p=a*b, miss=Math.random()<.2;
  const [x,y]=Math.random()<.5?[a,b]:[b,a];
  if(miss) return {key:'tm'+x+y,type:'num',kicker:'Le nombre mystère',prompt:`<div class="big">${x} × ? = ${p}</div>`,answer:y,explain:`${x} × <b>${y}</b> = ${p}<br>${TABLE_TIP(x,y)}${tableLine(x,y)}Pour trouver le nombre mystère, je récite la table de ${x} jusqu'à ${p}.`};
  return {key:'t'+x+y,type:'num',kicker:'Tables',prompt:`<div class="big">${x} × ${y} = ?</div>`,answer:p,explain:`${x} × ${y} = <b>${p}</b><br>${TABLE_TIP(x,y)}${tableLine(x,y)}${y>1?`Si j'oublie : ${x} × ${y} = ${x} × ${y-1} + ${x} = ${x*(y-1)} + ${x} = ${p}.`:''}`};
}

function genQCM(arr,kicker,pfx){

  return {key:pfx+q,type:'choice',kicker,prompt:`<div class="big" style="font-size:1.5rem">${esc(q)}</div>`,options:opts,answer:a,explain:e};
}

const W_TOP=88,W_BOT=-80;
const wP=([la,lo])=>[(lo+180)*2,(W_TOP-la)*2];

/* Dessin */
const ptsStr=(arr,P)=>arr.map(p=>P(p).map(v=>v.toFixed(1)).join(',')).join(' ');
const lab=(x,y,t,o={})=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" class="mlab ${o.cls||''}" ${o.size?`font-size="${o.size}"`:''}>${t}</text>`;
function marker(x,y,col){return `<circle cx="${x}" cy="${y}" r="15" fill="none" stroke="${col}" stroke-width="3" class="pulse"/><circle cx="${x}" cy="${y}" r="5" fill="${col}"/>`}
function mapSVG(sp,rv){
  rv=rv||{};const L=sp.lbl||{};const tgt=rv.target, bad=rv.wrong;
  const col=id=>sp.sel===id?'var(--fr)':rv.reveal?(id===tgt?'var(--good)':id===bad?'var(--bad)':null):null;
  const X=sp.explore, A=X?'mexp':'mtap';
  if(sp.m==='world'){
    let s=`<svg viewBox="0 0 720 ${(W_TOP-W_BOT)*2}" class="map" role="img" aria-label="carte du monde simplifiée"><rect width="720" height="${(W_TOP-W_BOT)*2}" fill="var(--sea)"/>`;
    for(const [c,polys] of Object.entries(WORLD)){
      const hl=sp.hlCont===c, cc=col(c);
      const fill=cc||(hl?'var(--fr)':'var(--land)');
      s+=`<g ${(sp.tap==='cont'||X)&&!rv.reveal?`data-act="${A}" data-id="${esc(c)}" class="hit"`:''}>${polys.map(p=>`<polygon points="${ptsStr(p,wP)}" fill="${fill}" stroke="var(--mapline)" stroke-width="1" stroke-linejoin="round"/>`).join('')}</g>`;
    }
    const [fx,fy]=wP([46.5,2.5]);s+=`<circle cx="${fx}" cy="${fy}" r="3.5" fill="var(--fr)" stroke="#fff" stroke-width="1"/>`+lab(fx-14,fy-6,'France',{size:11});
    if((sp.tap==='ocean'||X)&&!rv.reveal) for(const [o,pts] of Object.entries(OCEANS)) pts.forEach(p=>{const [x,y]=wP(p);s+=`<circle cx="${x}" cy="${y}" r="34" fill="transparent" data-act="${A}" data-id="${esc(o)}" class="hit"/>`});
    if(sp.star){const [x,y]=wP(sp.star);s+=marker(x,y,'var(--fr)')}
    if(L.cont||X||rv.reveal&&sp.kind==='cont') for(const [c,p] of Object.entries(W_LAB)){const [x,y]=wP(p);s+=lab(x,y,c,{size:15,cls:col(c)?'strong':''})}
    if(L.ocean||X||rv.reveal&&sp.kind==='ocean') for(const [o,pts] of Object.entries(OCEANS)){const [x,y]=wP(pts[0]);s+=lab(x,y+(sp.star?22:0),cap(o.replace('océan ','')),{size:14,cls:'sea '+(col(o)?'strong':'')})}
    if(rv.reveal&&sp.kind==='ocean'){(OCEANS[tgt]||[]).forEach(p=>{const [x,y]=wP(p);s+=marker(x,y,'var(--good)')});if(bad&&OCEANS[bad])OCEANS[bad].forEach(p=>{const [x,y]=wP(p);s+=marker(x,y,'var(--bad)')})}
    return s+'</svg>';
  }
  let s=`<svg viewBox="0 0 ${FR_W} ${FR_H}" class="map" role="img" aria-label="carte de France simplifiée"><rect width="${FR_W}" height="${FR_H}" fill="var(--other)"/>`;
  s+=`<polygon points="${ptsStr(SEA_ATL,frP)}" fill="var(--sea)"/><polygon points="${ptsStr(SEA_MED_POLY,frP)}" fill="var(--sea)"/>`;
  s+=`<polygon points="${ptsStr(FR_OUT,frP)}" fill="var(--land)" stroke="var(--mapline)" stroke-width="1.6" stroke-linejoin="round"/><polygon points="${ptsStr(CORSE,frP)}" fill="var(--land)" stroke="var(--mapline)" stroke-width="1.6" stroke-linejoin="round"/>`;
  for(const [m,p] of Object.entries(MASSIFS)){
    const hl=sp.hlMassif===m, cc=col(m);
    s+=`<polygon points="${ptsStr(p,frP)}" fill="${cc||(hl?'var(--fr)':'var(--mount)')}" opacity="${cc||hl?.85:.45}" stroke="${cc||(hl?'var(--fr)':'none')}" stroke-width="2" ${(sp.tap==='massif'||X)&&!rv.reveal?`data-act="${A}" data-id="${esc(m)}" class="hit"`:''}/>`;
  }
  for(const [r,p] of Object.entries(RIVERS)){
    const hl=sp.hlRiver===r, cc=col(r);
    s+=`<polyline points="${ptsStr(p,frP)}" fill="none" stroke="${cc||(hl?'var(--fr)':'var(--river)')}" stroke-width="${cc||hl?5:2.6}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if((sp.tap==='river'||X)&&!rv.reveal) s+=`<polyline points="${ptsStr(p,frP)}" fill="none" stroke="transparent" stroke-width="20" stroke-linecap="round" data-act="${A}" data-id="${esc(r)}" class="hit"/>`;
  }
  if(L.seas!==0) for(const [n,p] of Object.entries(SEAS)){if(sp.star&&sp.kind==='sea'&&!rv.reveal)continue;const [x,y]=frP(p);s+=lab(x,y+(n==='la mer du Nord'?8:0),cap(n),{cls:'sea '+(col(n)?'strong':''),size:n==='la mer du Nord'?11:13})}
  if(L.neighbors!==0) for(const [n,p] of Object.entries(NEIGH)){if(sp.arrow&&!rv.reveal)continue;const [x,y]=frP(p);s+=lab(x,y,cap(n),{cls:'nb '+(col(n)?'strong':''),size:n==='le Luxembourg'?10:12})}
  if(X){for(const [n,p] of Object.entries(SEAS)){const [x,y]=frP(p);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="26" fill="transparent" data-act="mexp" data-id="${esc(n)}" class="hit"/>`}
    for(const [n,p] of Object.entries(NEIGH)){const [x,y]=frP(p);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="22" fill="transparent" data-act="mexp" data-id="${esc(n)}" class="hit"/>`}}
  if(sp.cities){
    for(const [c,p] of Object.entries(CITIES)){
      if(sp.cities==='capitals'&&!CAPITALS.includes(c)&&c!==sp.hlCity)continue;
      const [x,y]=frP(p), hl=sp.hlCity===c, cc=col(c);
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${hl||cc?6:4}" fill="${cc||(hl?'var(--fr)':'var(--ink)')}" stroke="var(--card)" stroke-width="1.5"/>`;
      if(hl&&!rv.reveal)s+=marker(x.toFixed(1),y.toFixed(1),'var(--fr)');
      if((sp.tap==='city'||X)&&!rv.reveal)s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${c==='Pertuis'||c==='Marseille'?9:14}" fill="transparent" data-act="${A}" data-id="${esc(c)}" class="hit"/>`;
      if(X||L.cityNames||rv.reveal&&(sp.kind==='city'||sp.kind==='region')&&(cc||c===sp.hlCity))s+=lab(x,y-10,c,{size:12,cls:cc?'strong':''});
    }
  }
  if(X||rv.reveal&&sp.kind==='river') for(const [r,p] of Object.entries(R_LAB)){if(!X&&r!==tgt&&r!==bad)continue;const [x,y]=frP(p);s+=lab(x,y,cap(R_ART[r]),{size:13,cls:'strong riv'})}
  if(X||rv.reveal&&sp.kind==='massif') for(const [m,p] of Object.entries(M_LAB)){if(!X&&m!==tgt&&m!==bad)continue;const [x,y]=frP(p);s+=lab(x,y,cap(m),{size:13,cls:'strong'})}
  if(sp.star){const [x,y]=frP(sp.star);if(!rv.reveal)s+=marker(x,y,'var(--fr)')}
  if(sp.arrow){const [x,y]=frP(sp.arrow);if(!rv.reveal)s+=marker(x,y,'var(--fr)')}
  return s+'</svg>';
}

/* Questions de cartes */
const optsFrom=(all,ans,n=4)=>shuffle([ans,...shuffle(all.filter(x=>x!==ans)).slice(0,n-1)]);
function genCarte(only){
  const kinds=Array.isArray(only)?only:['rivQ','rivT','masQ','masT','cityT','cityQ','sea','neigh','region','contT','contQ','oceanQ','oceanT'];
  const k=pick(kinds);
  const base={lbl:{seas:1,neighbors:1}};
  if(k==='rivQ'||k==='rivT'){const r=pick(Object.keys(RIVERS));
    if(k==='rivQ')return {key:'mr'+r,type:'choice',kicker:'Carte de France',prompt:'Quel est le fleuve dessiné en <b>orange</b> ?',map:{m:'fr',kind:'river',hlRiver:r,...base},options:Object.keys(RIVERS).map(x=>R_ART[x]),answer:R_ART[r],target:r,explain:RIVER_INFO[r]};
    return {key:'mrt'+r,type:'maptap',kicker:'Carte de France',prompt:`Touche <b>${R_ART[r]}</b> sur la carte.`,map:{m:'fr',kind:'river',tap:'river',...base},target:r,answerLabel:R_ART[r],explain:RIVER_INFO[r],names:R_ART};}
  if(k==='masQ'||k==='masT'){const m=pick(Object.keys(MASSIFS));
    if(k==='masQ')return {key:'mm'+m,type:'choice',kicker:'Carte de France',prompt:'Quel massif montagneux est en <b>orange</b> ?',map:{m:'fr',kind:'massif',hlMassif:m,...base},options:optsFrom(Object.keys(MASSIFS),m),answer:m,target:m,explain:MASSIF_INFO[m]};
    return {key:'mmt'+m,type:'maptap',kicker:'Carte de France',prompt:`Touche <b>${m}</b> sur la carte.`,map:{m:'fr',kind:'massif',tap:'massif',...base},target:m,answerLabel:m,explain:MASSIF_INFO[m]};}
  if(k==='cityT'||k==='cityQ'){const c=pick(Object.keys(CITIES).filter(x=>x!=='Pertuis'));const info=`<b>${c}</b> se trouve dans la région ${CITIES[c][2]}.${c==='Paris'?' C’est la capitale de la France.':''}`;
    if(k==='cityQ')return {key:'mc'+c,type:'choice',kicker:'Carte de France',prompt:'Quelle est cette ville ?',map:{m:'fr',kind:'city',cities:'all',hlCity:c,...base},options:optsFrom(Object.keys(CITIES).filter(x=>x!=='Pertuis'),c),answer:c,target:c,explain:info};
    return {key:'mct'+c,type:'maptap',kicker:'Carte de France',prompt:`Touche la ville de <b>${c}</b>.`,map:{m:'fr',kind:'city',cities:'all',tap:'city',...base},target:c,answerLabel:c,explain:info};}
  if(k==='sea'){const n=pick(Object.keys(SEAS));return {key:'ms'+n,type:'choice',kicker:'Carte de France',prompt:'Comment s’appelle la mer ou l’océan marqué par le cercle ?',map:{m:'fr',kind:'sea',star:SEAS[n],...base},options:Object.keys(SEAS).map(cap),answer:cap(n),target:n,explain:SEA_INFO[n]};}
  if(k==='neigh'){const n=pick(Object.keys(NEIGH));return {key:'mn'+n,type:'choice',kicker:'Les voisins de la France',prompt:'Quel pays voisin est marqué par le cercle ?',map:{m:'fr',kind:'neigh',arrow:NEIGH[n],...base},options:optsFrom(Object.keys(NEIGH),n).map(cap),answer:cap(n),target:n,explain:`<b>${cap(n)}</b> est un pays voisin de la France, ${NEIGH[n][2]}.`};}
  if(k==='region'){const c=pick([...CAPITALS,'Pertuis']);const reg=CITIES[c][2];
    const info=c==='Pertuis'?`<b>Pertuis</b> est dans la région <b>Provence-Alpes-Côte d'Azur</b>, dans le département du Vaucluse. La capitale de la région est Marseille.`:`<b>${c}</b> est la capitale de la région <b>${reg}</b>.`;
    return {key:'mg'+c,type:'choice',kicker:'Les régions',prompt:`Ce point, c'est <b>${c}</b>${c==='Pertuis'?'':''}. Dans quelle région se trouve-t-il ?`,map:{m:'fr',kind:'region',cities:'capitals',hlCity:c,...base},options:optsFrom(REGIONS,reg),answer:reg,target:c,explain:info};}
  if(k==='contT'||k==='contQ'){const c=pick(Object.keys(WORLD));
    if(k==='contQ')return {key:'wc'+c,type:'choice',kicker:'Carte du monde',prompt:'Quel continent est en <b>orange</b> ?',map:{m:'world',kind:'cont',hlCont:c,lbl:{ocean:1}},options:optsFrom(Object.keys(WORLD),c),answer:c,target:c,explain:CONT_INFO[c]};
    return {key:'wct'+c,type:'maptap',kicker:'Carte du monde',prompt:`Touche <b>${c==='Europe'||c==='Afrique'||c==='Asie'||c==='Amérique'||c==='Océanie'||c==='Antarctique'?"l'"+c:c}</b> sur la carte.`,map:{m:'world',kind:'cont',tap:'cont',lbl:{ocean:1}},target:c,answerLabel:c,explain:CONT_INFO[c]};}
  const o=pick(Object.keys(OCEANS));
  if(k==='oceanQ')return {key:'wo'+o,type:'choice',kicker:'Carte du monde',prompt:'Quel océan est marqué par le cercle ?',map:{m:'world',kind:'ocean',star:OCEANS[o][0],lbl:{cont:1}},options:optsFrom(Object.keys(OCEANS),o).map(cap),answer:cap(o),target:o,explain:OCEAN_INFO[o]};
  return {key:'wot'+o,type:'maptap',kicker:'Carte du monde',prompt:`Touche l'<b>${o}</b> sur la carte.`,map:{m:'world',kind:'ocean',tap:'ocean',lbl:{cont:1}},target:o,answerLabel:cap(o),explain:OCEAN_INFO[o]};
}
const MAP_LABEL=id=>R_ART[id]?cap(R_ART[id]):cap(id);

function mapInfo(id){
  if(RIVER_INFO[id])return RIVER_INFO[id];if(MASSIF_INFO[id])return MASSIF_INFO[id];if(SEA_INFO[id])return SEA_INFO[id];
  if(NEIGH[id])return `<b>${cap(id)}</b> est un pays voisin de la France, ${NEIGH[id][2]}.`;
  if(CITIES[id])return id==='Pertuis'?`<b>Pertuis</b> est dans le Vaucluse, en région Provence-Alpes-Côte d'Azur.`:`<b>${id}</b> est en région ${CITIES[id][2]}.${CAPITALS.includes(id)?` C'est la capitale de la région${id==='Paris'?', et la capitale de la France':''}.`:''}`;
  if(CONT_INFO[id])return CONT_INFO[id];if(OCEAN_INFO[id])return OCEAN_INFO[id];return '';
}
function idFromLabel(v){const all=[...Object.keys(RIVERS),...Object.keys(MASSIFS),...Object.keys(SEAS),...Object.keys(NEIGH),...Object.keys(CITIES),...Object.keys(WORLD),...Object.keys(OCEANS)];
  return all.find(id=>id===v||cap(id)===v||R_ART[id]===v)||null}

/* Ronds dans des boîtes de 10 (jusqu'à 20) */
function dotsSVG(a,b,op){
  const total=op==='+'?a+b:a, rows=Math.max(1,Math.ceil(total/10)), W=300, H=14+rows*34;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="dots" role="img" aria-label="${op==='+'?a+' ronds bleus et '+b+' ronds orange':a+' ronds dont '+b+' barrés'}">`;
  for(let r=0;r<rows;r++)s+=`<rect x="4" y="${6+r*34}" width="${W-8}" height="30" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/><line x1="${W/2}" y1="${8+r*34}" x2="${W/2}" y2="${34+r*34}" stroke="var(--line)" stroke-width="2"/>`;
  for(let i=0;i<total;i++){const r=Math.floor(i/10),c=i%10,x=20+c*26.5+(c>=5?8:0),y=21+r*34;
    const crossed=op==='-'&&i>=a-b, col=op==='+'&&i>=a?'var(--fr)':'var(--mo)';
    s+=`<circle cx="${x}" cy="${y}" r="10" fill="${col}" opacity="${crossed?.3:1}"/>`;
    if(crossed)s+=`<path d="M${x-8} ${y-8} L${x+8} ${y+8} M${x+8} ${y-8} L${x-8} ${y+8}" stroke="var(--bad)" stroke-width="3" stroke-linecap="round"/>`;}
  return s+'</svg>';
}
/* Barres de dizaines et cubes d'unités */
function blocksSVG(groups){
  // groups: [{n, col, crossT, crossU, label}]
  let x=8, s='', H=150;

const TU=n=>`${Math.floor(n/10)} dizaine${Math.floor(n/10)>1?'s':''} et ${n%10} unité${n%10>1?'s':''}`;
/* Explication détaillée d'une addition ou d'une soustraction */
function addSubVisual(a,op,b){
  if(op==='+'&&a+b<=20)return dotsSVG(a,b,'+');
  if(op==='-'&&a<=20)return dotsSVG(a,b,'-');
  if(op==='+')return blocksSVG([{n:a,col:'var(--mo)'},{n:b,col:'var(--fr)'}]);
  const borrow=a%10<b%10;
  if(!borrow)return blocksSVG([{n:a,col:'var(--mo)',crossT:Math.floor(b/10),crossU:b%10,label:`${a} (j'en barre ${b})`}]);
  return blocksSVG([{n:a,col:'var(--mo)'},{n:b,col:'var(--fr)',op:'−'}]);
}
function addSubDetail(a,op,b){
  const r=op==='+'?a+b:a-b; let steps='';
  if(op==='+'){
    const L=Math.max(a,b), S=Math.min(a,b);
    if(r<=10) steps=`Je pars du plus grand nombre, <b>${L}</b>, et j'avance de ${S} : ${Array.from({length:S},(_,i)=>L+i+1).map((v,i,arr)=>i===arr.length-1?`<b>${v}</b>`:v).join(', ')}.<br>Les ronds bleus (${a}) et les ronds orange (${b}) : je les compte tous, il y en a <b>${r}</b>.`;
    else if(r<=20&&L<10){const need=10-L, rest=S-need;steps=`<b>Je fais 10 !</b> ${L} + ${need} = 10 (je remplis la boîte). Il reste ${S} − ${need} = ${rest} à ajouter.<br>10 + ${rest} = <b>${r}</b>.`;}
    else if(r<=20) steps=`Je regarde les unités : ${a%10} + ${b%10} = ${(a%10)+(b%10)}. La dizaine ne bouge pas : 10 + ${(a%10)+(b%10)} = <b>${r}</b>.`;
    else {const ua=a%10,ub=b%10,ta=Math.floor(a/10),tb=Math.floor(b/10),su=ua+ub;
      steps=`Je sépare les <b>dizaines</b> (les barres) et les <b>unités</b> (les cubes).<br>• Unités : ${ua} + ${ub} = ${su}${su>=10?` → c'est plus que 9 ! ${su} = 1 dizaine et ${su-10} unités. Je garde ${su-10} unités et j'ajoute 1 dizaine.`:'.'}<br>• Dizaines : ${ta} + ${tb}${su>=10?' + 1':''} = ${ta+tb+(su>=10?1:0)} dizaines.<br>Résultat : ${ta+tb+(su>=10?1:0)} dizaines et ${su%10} unités = <b>${r}</b>.`;}
  } else {
    if(a<=10) steps=`J'ai <b>${a}</b> ronds. J'en barre <b>${b}</b>. Je compte ceux qui restent : <b>${r}</b>.<br>Ou je recule de ${b} à partir de ${a} : ${Array.from({length:b},(_,i)=>a-i-1).map((v,i,arr)=>i===arr.length-1?`<b>${v}</b>`:v).join(', ')}.`;
    else if(a<=20&&(a%10>=b%10||b===10)) steps=b===10?`J'enlève la dizaine entière : ${a} − 10 = <b>${r}</b>.`:`Je regarde les unités : ${a%10} − ${b} = ${a%10-b}. La dizaine ne bouge pas : 10 + ${a%10-b} = <b>${r}</b>.`;
    else if(a<=20){const f=a-10, rest=b-f;steps=`<b>Je passe par 10 !</b> D'abord ${a} − ${f} = 10. J'ai enlevé ${f}, il reste encore ${b} − ${f} = ${rest} à enlever.<br>10 − ${rest} = <b>${r}</b>.`;}
    else {const ua=a%10,ub=b%10,ta=Math.floor(a/10),tb=Math.floor(b/10);
      if(ua>=ub) steps=`Je sépare les <b>dizaines</b> et les <b>unités</b>.<br>• Unités : ${ua} − ${ub} = ${ua-ub}.<br>• Dizaines : ${ta} − ${tb} = ${ta-tb}.<br>Résultat : ${ta-tb} dizaine${ta-tb>1?'s':''} et ${ua-ub} unité${ua-ub>1?'s':''} = <b>${r}</b>.`;
      else steps=`Les unités : ${ua} − ${ub}, ce n'est pas possible ! Je <b>casse une dizaine</b> en 10 unités : ${a} = ${ta-1} dizaines et ${ua+10} unités.<br>• Unités : ${ua+10} − ${ub} = ${ua+10-ub}.<br>• Dizaines : ${ta-1} − ${tb} = ${ta-1-tb}.<br>Résultat : <b>${r}</b>.`;}
  }
  const check=op==='-'?`<div class="rule"><b>Je vérifie avec une addition :</b> ${r} + ${b} = ${a} ✔</div>`:`<div class="rule"><b>Astuce :</b> ${a} + ${b} = ${b} + ${a}. Je peux commencer par le plus grand nombre, c'est plus facile.</div>`;
  return `<div class="rule">${steps}</div><div class="svgwrap center vis">${addSubVisual(a,op,b)}</div>${check}`;
}

/* ============ Détail en colonnes (grands nombres, multiplication) ============ */
function posedSteps(t,a,b){
  const r=t==='add'?a+b:t==='sub'?a-b:a*b, out=[];let c=0;const L=n=>String(n).length,D=(n,i)=>Math.floor(n/10**i)%10;
  const NAMES=['Unités','Dizaines','Centaines','Milliers','Dizaines de milliers','Centaines de milliers'];
  for(let i=0;i<L(r);i++){let d,h,co=0;
    if(t==='add'){const x=D(a,i),y=D(b,i),s2=x+y+c;d=s2%10;co=Math.floor(s2/10);h=(i>=L(a)&&i>=L(b))?`il reste la retenue : j'écris <b>${c}</b>`:`${x} + ${y}${c?' + '+c+' (retenue)':''} = ${s2} → j'écris <b>${d}</b>${co?', je retiens 1':''}`}
    else if(t==='sub'){const x=D(a,i),y=D(b,i)+c;if(x<y){d=x+10-y;co=1;h=`${x} est trop petit : ${x+10} − ${y} = <b>${d}</b>, et je reporte +1 en bas à la colonne suivante`}else{d=x-y;h=`${x} − ${y} = <b>${d}</b>`}}
    else{if(i>=L(a)){d=c;h=`il reste la retenue : j'écris <b>${c}</b>`}else{const x=D(a,i),p=x*b+c;d=p%10;co=Math.floor(p/10);h=`${x} × ${b}${c?' + '+c+' (retenue)':''} = ${p} → j'écris <b>${d}</b>${co?`, je retiens ${co}`:''}`}}
    out.push(`<li><b>${NAMES[i]||'Colonne suivante'}</b> : ${h}.</li>`);c=co}
  return `<ol class="steps">${out.join('')}</ol>`;
}
function calcDetail(a,op,b){
  if((op==='+'||op==='-')&&a<=99&&b<=99)return addSubDetail(a,op,b);
  if(op==='+'||op==='-'){const r=op==='+'?a+b:a-b;return `<div class="rule"><b>Je pose l'opération</b> (unités sous unités, dizaines sous dizaines) et je calcule en partant de la droite :${posedSteps(op==='+'?'add':'sub',a,b)}</div><div class="rule"><b>Je vérifie :</b> ${op==='-'?`${r} + ${b} = ${a} ✔`:`l'ordre de grandeur : environ ${Math.round(a/100)*100} + ${Math.round(b/100)*100} = ${Math.round(a/100)*100+Math.round(b/100)*100}`}</div>`}
  const r=a*b;
  if(a<=10&&b<=10)return `<div class="rule"><b>${a} × ${b}</b>, c'est ${b} fois ${a} : ${Array(b).fill(a).join(' + ')} = <b>${r}</b>.</div>${typeof tableLine==='function'?tableLine(a,b):''}`;
  if(b<10)return `<div class="rule"><b>Je pose la multiplication</b> et je multiplie chaque chiffre de ${a} par ${b}, en partant de la droite :${posedSteps('mul',a,b)}</div>`;
  if(a<10)return calcDetail(b,'×',a).replace('<div class="rule">','<div class="rule">'+`${a} × ${b} = ${b} × ${a}. `);
  const tb=Math.floor(b/10)*10, ub=b%10;
  return `<div class="rule"><b>Je décompose ${b}</b> en ${tb} + ${ub} :<br>• ${a} × ${ub} = ${a*ub}<br>• ${a} × ${tb} = ${a*tb} (je calcule ${a} × ${tb/10}, puis j'ajoute un 0)<br>• J'additionne : ${a*ub} + ${a*tb} = <b>${r}</b></div>`;
}
const calcOps=()=>window.CALC_OPS||['+','−'];
const calcMax=()=>window.CALC_DIGITS||3;
/* ============ LA CALCULETTE : je compose mon calcul et je le résous ============ */
const CALC={open:false,a:'',op:'',b:'',ans:'',stage:'compose',msg:'',tries:0};
function openCalc(){CALC.open=true;CALC.a=CALC.op=CALC.b=CALC.ans='';CALC.stage='compose';CALC.msg='';CALC.tries=0;renderCalc()}
function closeCalc(){CALC.open=false;const c=document.getElementById('calc');if(c)c.remove()}
function renderCalc(){

  const expr=`${CALC.a||'<span class="ph">?</span>'} ${CALC.op?CALC.op:''} ${CALC.op?(CALC.b||'<span class="ph">?</span>'):''}`;

  } else if(CALC.stage==='answer'){
    body=`<div class="cdisp">${CALC.a} ${CALC.op} ${CALC.b} = <span class="cans">${CALC.ans||'?'}</span></div><div class="csub">${CALC.msg||'À toi ! Calcule dans ta tête ou sur une feuille, puis tape ta réponse.'}</div>
     <div class="cpad">${keys.map(k=>`<button data-act="ck" data-v="${k}">${k}</button>`).join('')}<button data-act="ck" data-v="⌫" aria-label="effacer">⌫</button><button data-act="ck" data-v="0">0</button><button data-act="ck" data-v="ok" class="eq">Vérifier</button></div>

     <div class="cexp">${calcDetail(a,CALC.op==='+'?'+':CALC.op==='×'?'×':'-',b)}</div><div class="row"><button class="btn" data-act="ck" data-v="new">Nouveau calcul</button></div>`;
  }

function calcKey(v){
  if(CALC.stage==='done'){if(v==='new'||v==='ok')openCalc();return}

    else if(v==='⌫'){if(CALC.b)CALC.b=CALC.b.slice(0,-1);else if(CALC.op)CALC.op='';else CALC.a=CALC.a.slice(0,-1)}
    else if(v==='='||v==='ok'){
      if(!CALC.a||!CALC.op||!CALC.b)CALC.msg='Il manque un morceau : écris deux nombres et un signe.';
      else if(CALC.op==='−'&&+CALC.b>+CALC.a)CALC.msg='Pour une soustraction, le premier nombre doit être le plus grand. Essaie autrement !';

      if(+CALC.ans===r){CALC.ok=true;CALC.stage='done';sGood();const m=document.getElementById('mascot')||document.getElementById('homeSq');poke(m,'jump','happy')}

      else{CALC.ok=false;CALC.stage='done';sBad()}}
  }

/* Écoute en anglais (voix du navigateur) */
/* Voix anglaise native : on la choisit nous-mêmes, sinon le navigateur lit avec sa voix française */
let EN_VOICE=null;
function pickEnVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));if(!vs.length)return null;
  const pref=['Daniel','Kate','Serena','Google UK English Female','Google UK English Male','Samantha','Karen','Moira','Google US English'];
  for(const n of pref){const v=vs.find(x=>x.name.startsWith(n));if(v)return v}
  return vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]}catch(e){return null}}
if(typeof speechSynthesis!=='undefined'){EN_VOICE=pickEnVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',()=>{EN_VOICE=pickEnVoice()})}
function sayEn(t){try{if(typeof speechSynthesis==='undefined')return;speechSynthesis.cancel();EN_VOICE=EN_VOICE||pickEnVoice();
  if(!EN_VOICE){alert("Il n'y a pas de voix anglaise sur cet appareil. Sur iPad : Réglages → Accessibilité → Contenu énoncé → Voix → Anglais.");return}
  const u=new SpeechSynthesisUtterance(t);u.voice=EN_VOICE;u.lang=EN_VOICE.lang;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say-en]');if(b){e.preventDefault();e.stopPropagation();sayEn(b.dataset.sayEn)}},true);
const enBtn=t=>`<button type="button" class="enbtn" data-say-en="${esc(t)}" aria-label="Écouter en anglais">🔊 Écouter</button>`;
function genEn(){
  const [q,a,d,e,sy]=pick(EN);
  return {key:'en'+q,type:'choice',kicker:'Anglais',prompt:`<div class="big" style="font-size:1.5rem">${esc(q)}</div>${enBtn(sy)}`,options:shuffle([a,...d]),answer:a,explain:e+`<div style="margin-top:8px">${enBtn(sy)}</div>`};
}
function genAnat(){const [q,a,d,e]=pick(ANAT);return {key:'an'+q,type:'choice',kicker:'Le corps humain',prompt:`<div class="big" style="font-size:1.5rem">${esc(q)}</div>`,options:shuffle([a,...d]),answer:a,explain:e}}

function goalCard(){
  const r=rec(), m=minsToday(), pc=pctOf(r), ws=weekStats(), met=dayMet(r);
  const L=['L','M','M','J','V','S','D'], t=today();
  const days=ws.ds.map((d,k)=>{const x=P.days[d];const cls=dayMet(x)?'won':(x&&x.q?'played':'');return `<span class="day ${cls} ${d===t?'today':''}" title="${d}">${L[k]}</span>`}).join('');
  let status;
  if(met) status=`<div class="status won">Objectif du jour réussi ! Ta récompense : ${esc(P.set.daily)}</div>`;
  else if(m<P.set.min) status=`<div class="status">Encore <b>${P.set.min-m} min</b> pour l'objectif du jour${r.q&&pc<P.set.pct?`, avec au moins ${P.set.pct} % de bonnes réponses`:''}.</div>`;
  else if(r.q<10) status=`<div class="status">Réponds encore à <b>${10-r.q}</b> question${10-r.q>1?'s':''} pour valider ta journée.</div>`;
  else status=`<div class="status">Le temps est fait ! Remonte ta réussite à <b>${P.set.pct} %</b> en jouant encore un peu.</div>`;
  const w=ws.w;
  let gift;
  if(w.unlocked&&w.choice) gift=`Cadeau de la semaine gagné ! Tu as choisi : <b>${esc(w.choice)}</b>${w.given?' (reçu)':''}.`;
  else if(w.unlocked) gift=`Cadeau de la semaine gagné ! <button class="btn" style="padding:8px 14px;font-size:1rem" data-act="giftpick">Choisir mon cadeau</button>`;
  else gift=`Cadeau de la semaine : <b>${ws.won}</b> jour${ws.won>1?'s':''} réussi${ws.won>1?'s':''} sur <b>${P.set.wdays}</b> · réussite de la semaine <b>${ws.pct} %</b> (objectif ${P.set.wpct} %)${P.set.parentOk?' · + validation de Maman':''}.`;
  return `<section class="goal"><h2>Mon objectif du jour</h2>
   <div class="meter"><div class="lab"><span>Temps</span><span>${m} / ${P.set.min} min</span></div><div class="trk"><b style="width:${Math.min(100,m/P.set.min*100)}%"></b></div></div>

   ${status}
   <div class="week" aria-label="Ma semaine">${days}</div><div class="giftline">${gift}</div></section>`;
}

/* ============ GAME ============ */
function startRevision(){
  const items=shuffle(P.carnet).slice(0,N);if(!items.length)return home();
  setAccent('fr');
  G={mod:REV,qs:items.map(e=>JSON.parse(JSON.stringify(e.q))),i:0,res:[],log:[],memo:false,earned:0,active:true,startStars:P.stars,n:items.length};
  lastAct=Date.now();save();renderQ();
}
function start(id){
  const m=modById(id);setAccent(m.sub);
  const qs=[],keys=new Set();let guard=0;
  while(qs.length<N&&guard++<400){const q=m.gen();if(keys.has(q.key))continue;keys.add(q.key);q.modId=m.id;qs.push(q)}
  G={mod:m,qs,i:0,res:[],log:[],memo:false,earned:0,active:true,startStars:P.stars};
  lastAct=Date.now();save();renderQ();
}
function topBar(){
  return `<div class="top"><button class="iconbtn" data-act="home" aria-label="Quitter">←</button>${squishy(P.companion,'idle','mascot','id="mascot"')}<div class="title">${G.mod.name}</div><span class="chip" id="tchip">${timeLabel()}</span>${typeof CALC!=='undefined'?'<button class="iconbtn" data-act="calc" aria-label="Calculette">+−</button>':''}<button class="iconbtn" data-act="memo" aria-pressed="${G.memo}">Rappel</button></div>
  ${G.chrono?`<div class="timer"><b id="tbar" style="width:${G.left/60*100}%"></b></div>`:`<div class="prog">${Array.from({length:G.n||N},(_,k)=>`<i class="${k<G.res.length?(G.res[k]?'ok':'ko'):(k===G.i?'cur':'')}"></i>`).join('')}</div>`}`;
}
function renderQ(){
  const q=G.qs[G.i]; G.locked=false; G.input=''; keyHandler=null;
  let body='';
  const head=`<div class="kicker">${q.kicker}${G.chrono?` · ${G.score} bonne${G.score>1?'s':''} réponse${G.score>1?'s':''}`:` · question ${G.i+1} sur ${G.n||N}`}</div>`;
  if(q.modId)setAccent(modById(q.modId).sub);
  if(q.type==='choice'){
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div>${q.visual?`<div class="svgwrap center">${q.visual}</div>`:''}${q.map?`<div class="mapwrap" id="qmap">${mapSVG(q.map)}</div>`:''}</div><div class="opts ${q.options.length===4&&q.options.every(o=>o.length<12)?'four':''} ${q.letters?'letters':''}">${q.options.map((o,k)=>`<button class="opt" data-act="choose" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  } else if(q.type==='chunks'){
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div><div class="chunks">${q.chunks.map((c,k)=>`<button class="chunk" data-act="chunk" data-k="${k}">${esc(c)}</button>`).join('')}</div></div>`;
  } else if(q.type==='chunksq'){
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div><div class="chunks">${q.chunks.map((c,k)=>`<span class="chunk ${k===q.hlIdx?'hl2':''}">${esc(c)}</span>`).join('')}</div></div><div class="opts four">${q.options.map((o,k)=>`<button class="opt" data-act="choose" data-k="${k}">${o}</button>`).join('')}</div>`;
  } else if(q.type==='num'){
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div>${q.visual?`<div class="svgwrap">${q.visual}</div>`:''}<div class="answer"><span>=</span><span class="slot empty" id="slot">?</span></div></div>${pad(true)}`;
    keyHandler=numKey;
  } else if(q.type==='tick'){
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div><div class="svgwrap" id="lsvg">${lineSVG(q.cfg,null,true)}</div><div class="sub" style="font-size:.9rem">Calcule d'abord le pas, puis touche le bon trait.</div></div>`;
  } else if(q.type==='posed'){
    G.col=0;G.err=0;G.colErr=0;G.done=[];G.auto=false;
    body=`<div class="qcard">${head}<div class="prompt">Calcule en commençant par la droite. Tape chaque chiffre du résultat.</div><div class="posed" id="posed"></div><div class="hint" id="hint" hidden></div></div>${pad(false)}`;
    keyHandler=posedKey;
  } else if(q.type==='hunt'){
    G.sel=new Set();
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div><div class="hunt" id="hunt">${q.cells.map((c,k)=>`<button class="hcell" data-act="hunt" data-k="${k}">${c}</button>`).join('')}</div><div class="row"><button class="btn" data-act="huntok">J'ai fini</button></div></div>`;
  } else if(q.type==='maptap'){
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div><div class="mapwrap" id="qmap">${mapSVG(q.map)}</div></div>`;
  } else if(q.type==='order'){
    G.ord=[];
    body=`<div class="qcard">${head}<div class="prompt">${q.prompt}</div><div class="ordcards" id="ordc"></div><div class="row" style="justify-content:flex-start"><button class="btn ghost" data-act="ordreset">Recommencer</button></div></div>`;
  }
  G.hintN=0;const hs=hintSteps(q);
  const hb=hs.length?`<div class="hints" id="hints"><button class="btn ghost hbtn" data-act="hint">Un coup de pouce (1/${hs.length})</button><div id="hintlist"></div></div>`:'';
  $app.innerHTML=topBar()+injectHints(body,hb)+(G.memo?`<div class="memo">${memoOf(q)}</div>`:'');
  if(q.type==='posed')drawPosed();
  if(q.type==='order')drawOrder();
}
function drawOrder(res){
  const q=G.qs[G.i];
  document.getElementById('ordc').innerHTML=q.events.map((e,k)=>{const pos=G.ord.indexOf(k);
    let cls=pos>=0?'sel':'';if(res)cls+=' '+(res[k]?'ok':'ko');
    return `<button class="ord ${cls}" data-act="ord" data-k="${k}" ${res?'disabled':''}><span class="n">${pos>=0?pos+1:''}</span><span>${esc(e[1])}${res&&e[2]!==null?` <span class="sub">(${yr(e[0])})</span>`:''}</span></button>`}).join('');
}
function ordTap(k){
  if(G.locked||G.ord.includes(k))return;G.ord.push(k);beep([[500+G.ord.length*80,.06]]);
  const q=G.qs[G.i];
  if(G.ord.length<q.events.length){drawOrder();return}
  const sorted=q.events.map((e,k)=>k).sort((a,b)=>q.events[a][0]-q.events[b][0]);
  const res={};G.ord.forEach((k,p)=>{res[k]=sorted[p]===k});
  const ok=G.ord.every((k,p)=>sorted[p]===k);
  drawOrder(res);finish(ok,'',G.ord.map(k=>q.events[k][1]).join(' → '));
}
function hintSteps(q){
  const out=[];const memo=memoOf(q);
  if(memo)out.push({t:'Le rappel',h:memo.replace(/<h3>.*?<\/h3>/,'')});
  const M=(typeof METHODS!=='undefined'&&METHODS[q.modId||G.mod.id])||'';
  if(M)out.push({t:'La méthode',h:M});
  if(q.hint)out.push({t:'Un dessin pour t\u2019aider',h:q.hint});
  return out;
}
function injectHints(body,hb){
  if(!hb)return body;const i=body.indexOf('<div class="qcard">');if(i<0)return body+hb;
  // insère les indices à la fin de la carte de question (avant sa fermeture)
  let depth=0,j=i;const re=/<\/?div\b[^>]*>/g;re.lastIndex=i;let m;
  while((m=re.exec(body))){if(m[0].startsWith('</'))depth--;else depth++;if(depth===0){j=m.index;break}}
  return body.slice(0,j)+hb+body.slice(j);
}
function showHint(){
  const q=G.qs[G.i],hs=hintSteps(q);if(G.hintN>=hs.length)return;
  const st=hs[G.hintN++],box=document.getElementById('hintlist');
  const d=document.createElement('div');d.className='hstep';d.innerHTML=`<div class="kicker">Indice ${G.hintN} · ${st.t}</div>${st.h}`;box.appendChild(d);
  const b=document.querySelector('[data-act="hint"]');if(b){if(G.hintN>=hs.length)b.remove();else b.textContent=`Encore un coup de pouce (${G.hintN+1}/${hs.length})`}
  beep([[540,.06]]);
}
function pad(withOk){
  const keys=['7','8','9','4','5','6','1','2','3',withOk?',':'','0','⌫'];
  return `<div class="pad">${keys.map(k=>k?`<button data-act="key" data-v="${k}" aria-label="${k==='⌫'?'effacer':k}">${k}</button>`:'<span></span>').join('')}${withOk?'<button class="okk" data-act="key" data-v="ok">Valider</button>':''}</div>`;
}
function numKey(v){
  if(G.locked)return;const q=G.qs[G.i];
  if(v==='ok'){if(!G.input||G.input===',')return;const val=parseFloat(G.input.replace(',','.'));const ok=Math.abs(val-q.answer)<1e-9;
    const s=document.getElementById('slot');s.classList.add(ok?'ok':'ko');finish(ok,'',G.input);return;}
  if(v==='⌫')G.input=G.input.slice(0,-1);
  else if(v===','){if(!G.input.includes(','))G.input+=(G.input?'':'0')+','}
  else if(G.input.length<8)G.input+=v;
  const s=document.getElementById('slot');s.textContent=G.input||'?';s.classList.toggle('empty',!G.input);
}
function drawPosed(){
  const q=G.qs[G.i], W=Math.max(len(q.a),len(q.b),len(q.r))+1;
  const cell=(c,cls='')=>`<div class="pc ${cls}">${c}</div>`;
  const row=(fn,cls='')=>`<div class="prow ${cls}">${Array.from({length:W},(_,j)=>fn(W-1-j,j)).join('')}</div>`;
  const doneCarry=i=>(i>0&&G.done.length>=i&&q.steps[i-1].co)?q.steps[i-1].co:'';
  let h='';
  if(q.t!=='sub') h+=row(i=>cell(doneCarry(i)||'','carry'));
  h+=row(i=>{if(i>=len(q.a))return cell('');const d=dg(q.a,i);const sub=q.t==='sub'&&G.done.length>i&&q.steps[i].co?'<sup>1</sup>':'';return cell(sub+d)});
  h+=row((i,j)=>{if(j===0)return cell(q.sym);if(i>=len(q.b))return cell('');return cell(dg(q.b,i))});
  if(q.t==='sub') h+=row(i=>cell(doneCarry(i)?'+1':'','under'));
  h+=row((i,j)=>{if(j===0)return cell('');if(i>=len(q.r))return cell('');
    if(i<G.done.length)return cell(q.steps[i].d,'res done');
    return cell('',`res ${i===G.done.length?'act':''}`)},'line');
  document.getElementById('posed').innerHTML=h;
}
function posedKey(v){
  if(G.locked||v==='⌫'||v===','||v==='ok')return;
  const q=G.qs[G.i], st=q.steps[G.done.length], hint=document.getElementById('hint');
  if(+v===st.d){G.done.push(+v);G.colErr=0;hint.hidden=true;beep([[700,.06]]);drawPosed();
    if(G.done.length===q.steps.length){finish(!G.auto,G.auto?'':G.err?`Bravo, tu t'es corrigée toute seule en route (${G.err} chiffre${G.err>1?'s':''} à reprendre). Relis bien les colonnes ci-dessous.`:'')}
    return;}
  G.err++;G.colErr++;sBad();poke(document.getElementById('mascot'),'sad','sad');
  hint.hidden=false;hint.innerHTML=(G.colErr>=2?'Regarde bien : ':'Pas tout à fait. ')+st.h;
  const act=document.querySelector('.pc.res.act');if(act){act.classList.remove('shake');void act.offsetWidth;act.classList.add('shake')}
  if(G.colErr>=3){G.auto=true;G.done.push(st.d);G.colErr=0;drawPosed();if(G.done.length===q.steps.length)finish(false,'')}
}
function answerLabel(q){
  if(q.type==='choice'||q.type==='chunksq')return q.answer;
  if(q.type==='chunks')return clean(q.chunks[q.answerIdx]);
  if(q.type==='num')return fmt(q.answer);
  if(q.type==='tick')return fmt(q.val);
  if(q.type==='posed')return fmt(q.r);
  if(q.type==='order')return q.events.slice().sort((a,b)=>a[0]-b[0]).map(e=>e[1]).join(' → ');
  if(q.type==='maptap')return q.answerLabel;
  if(q.type==='hunt')return `${q.cells.filter(c=>c===q.target).length} lettres « ${q.target} »`;
  return '';
}
function plainPrompt(q){
  if(q.type==='posed')return `${q.kicker} : ${fmt(q.a)} ${q.sym} ${fmt(q.b)}`;
  const d=document.createElement('div');d.innerHTML=q.prompt;let t=d.textContent.replace(/\s+/g,' ').trim();
  if(q.type==='chunks'||q.type==='chunksq')t+=' — « '+q.chunks.join(' ')+' »'+(q.type==='chunksq'?' (groupe : '+q.chunks[q.hlIdx]+')':'');
  return q.kicker+' : '+t;
}
function track(ok,q,given){
  const r=rec();r.q++;if(ok)r.ok++;
  if(window.SYNC)try{window.SYNC.attempt({module_id:q.modId||(G&&G.mod.id)||'',question_key:String(q.key).slice(0,200),prompt:plainPrompt(q).slice(0,500),given:String(given||'').slice(0,200),answer:String(answerLabel(q)).slice(0,300),is_correct:!!ok,hints_used:(G&&G.hintN)||0})}catch(e){}
  P.carnet=P.carnet||[];
  const i=P.carnet.findIndex(e=>e.q.key===q.key);
  if(!ok){const e={q:JSON.parse(JSON.stringify(q)),given:given||'',d:today()};if(i>=0)P.carnet[i]=e;else P.carnet.push(e);if(P.carnet.length>40)P.carnet.shift()}
  else if(i>=0&&G&&G.mod.id==='revision')P.carnet.splice(i,1);
  save();
}
function feedbackHTML(q,ok,given,pre){
  if(ok)return `<div class="fbtitle">Pourquoi c'est juste</div>${q.explain}`;
  const why=q.whyMap&&given&&q.whyMap[given];
  return `${given?`<div class="fbline">Ta réponse : <s>${esc(given)}</s></div>`:''}<div class="fbline">Bonne réponse : <b>${esc(answerLabel(q))}</b></div>${why?`<div class="why">${why}</div>`:''}${pre?`<div class="why">${pre}</div>`:''}<div class="fbtitle">À retenir</div>${q.explain}`;
}
function finish(ok,pre,given){
  G.locked=true;keyHandler=null;
  const q=G.qs[G.i];
  track(ok,q,given);
  poke(document.getElementById('mascot'),ok?'jump':'sad',ok?'happy':'sad');
  if(G.chrono){chronoNext(ok,q);return}
  G.res.push(ok);G.log.push({ok,q:plainPrompt(q),given:given||'',ans:answerLabel(q),explain:q.explain});
  if(ok){G.earned++;P.stars++;save();sGood()}else sBad();
  const praise=pick(['Bravo !','Super !','Exact !','Tu gères !','Parfait !','Génial !']);
  const sh=document.createElement('div');sh.className='sheet '+(ok?'good':'bad');sh.setAttribute('role','status');
  sh.innerHTML=`<div class="in">${squishy(P.companion,ok?'happy':'sad',ok?'jump':'sad')}<div class="msg"><h3>${ok?praise+' +1 ★':'Pas tout à fait…'}</h3><div class="fb">${feedbackHTML(q,ok,given,pre)}</div></div><button class="btn" data-act="next" id="nextbtn">Continuer</button></div>`;
  document.body.appendChild(sh);
  setTimeout(()=>{const b=document.getElementById('nextbtn');b&&b.focus({preventScroll:true})},50);
  keyHandler=v=>{if(v==='ok')next()};
}
function next(){
  document.querySelectorAll('.sheet').forEach(s=>s.remove());
  if(!G)return;
  G.i++;if(G.i>=(G.n||N))return end();
  renderQ();window.scrollTo({top:0});
}
function newSquishyBlock(prevStars){
  const before=Math.min(SQ.length,1+Math.floor(prevStars/PER)), now=unlocked();
  if(now<=before)return '';
  const i=now-1;return `<div class="newstk">${squishy(i,'happy','dance','style="width:90px"')}<div>Nouveau champion recruté : <b>${SQ[i].n}</b> !</div></div>`;
}
function end(){
  G.active=false;save();
  const sc=G.res.filter(Boolean).length, cr=sc>=9?3:sc>=7?2:sc>=5?1:0;
  if(G.mod.id!=='revision')P.best[G.mod.id]=Math.max(P.best[G.mod.id]||0,cr);save();
  const t=sc===10?'Sans faute !':sc>=8?'Excellent !':sc>=6?'Bien joué !':sc>=4?'Tu progresses !':'On continue !';
  const msg=sc>=8?'Tu maîtrises de mieux en mieux.':sc>=5?'Encore une partie et ce sera encore mieux.':'Relis le rappel, puis rejoue : c’est en s’entraînant qu’on progresse.';
  keyHandler=null;
  const levelMsg=typeof levelEnd==='function'?levelEnd(sc):'';
  $app.innerHTML=`<div class="endcard"><div class="kicker">${G.mod.name}</div>${squishy(P.companion,sc>=5?'happy':'idle',sc>=7?'dance':'','style="width:110px"')}<h1>${t}</h1>
   <div class="bigcrowns">${[1,2,3].map(k=>`<i class="${k<=cr?'on':''}"></i>`).join('')}</div>
   <p class="prompt"><b>${sc}</b> bonnes réponses sur ${G.n||N} · <b>+${G.earned} ★</b></p><p class="sub">${msg}<br>Aujourd'hui : ${timeLabel()} · ${pctOf(rec())} % de bonnes réponses.</p>${levelMsg}
   ${newSquishyBlock(G.startStars)}
   <div class="row"><button class="btn" data-act="replay">Rejouer</button><button class="btn ghost" data-act="home">Accueil</button></div></div>
   <section class="recap"><h2>Revoir la partie</h2><p class="sub">Touche une question pour relire l'explication.</p>${G.log.map((l,k)=>`<details class="rq ${l.ok?'ok':'ko'}" ${l.ok?'':'open'}><summary><span class="mk">${l.ok?'✓':'✗'}</span><span>${k+1}. ${esc(l.q)}</span></summary><div class="rqb">${l.ok?'':`<div class="fbline">Ta réponse : <s>${esc(l.given)}</s></div>`}<div class="fbline">Bonne réponse : <b>${esc(l.ans)}</b></div>${l.explain}</div></details>`).join('')}</section>
   ${G.mod.id!=='revision'?`<div class="memo">${MEMO[G.mod.id]||''}</div>`:''}`;
  if(sc>=7){sWin();confetti()}
  setTimeout(checkRewards,900);
}
